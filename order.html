      <td><input class="li-input num" value="${ln.unit_price??''}" data-i="${i}" data-k="unit_price" placeholder="0.00"></td>
      <td class="disc-cell">
        <select class="li-disc" data-i="${i}">${discOpts.map(d=>`<option value="${d}" ${parseFloat(ln.discount_pct)===d?'selected':''}>${d===0?'—':d+'%'}</option>`).join('')}</select>
        ${parseFloat(ln.discount_pct)===100?`<div class="disc-waived waived-full">Charges Waived</div>`:(waived>0?`<div class="disc-waived">−${money(waived)}</div>`:'')}
      </td>
      <td class="li-amt">${money(ln.net_amount)}</td>
      <td><button class="li-del" data-del="${i}">×</button></td>`;
    tb.appendChild(tr);
  });
  // plain inputs (description, qty, unit, price)
  tb.querySelectorAll('.li-input:not(.cb-cat):not(.cb-style):not(.cb-desc)').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const i=+inp.dataset.i,k=inp.dataset.k;let v=inp.value;
      if(k==='quantity'||k==='unit_price'||k==='supplier_quantity')v=parseFloat(v)||0;
      LINES[i][k]=v;
      if(inp.classList.contains('li-desc')) autoGrow(inp);
      recompute(i,inp.closest('tr'));markDirty();
    });
  });
  // size description textareas to fit their content
  tb.querySelectorAll('.li-desc').forEach(autoGrow);
  // discount dropdown
  tb.querySelectorAll('.li-disc').forEach(sel=>{
    sel.addEventListener('change',()=>{
      const i=+sel.dataset.i;
      LINES[i].discount_pct=parseFloat(sel.value)||0;
      LINES[i].amount=(parseFloat(LINES[i].quantity)||0)*(parseFloat(LINES[i].unit_price)||0);
      LINES[i].net_amount=LINES[i].amount-(LINES[i].amount*(LINES[i].discount_pct/100));
      renderLines();recalc();markDirty();
    });
  });
  // comboboxes
  tb.querySelectorAll('.cb-cat').forEach(inp=>wireCombo(inp,'cat'));
  tb.querySelectorAll('.cb-style').forEach(inp=>wireCombo(inp,'style'));
  tb.querySelectorAll('.cb-desc').forEach(inp=>wireCombo(inp,'desc'));
  tb.querySelectorAll('.cb-sup').forEach(inp=>wireSupplierCombo(inp));
  tb.querySelectorAll('.li-del').forEach(b=>b.addEventListener('click',()=>deleteLine(+b.dataset.del)));
  tb.querySelectorAll('.alloc-btn,[data-alloc].alloc-summary').forEach(b=>b.addEventListener('click',()=>openSplit(+b.dataset.alloc)));
  applySupplierColVisibility();
  recalc();
}

function recompute(i,tr){
  LINES[i].amount=(parseFloat(LINES[i].quantity)||0)*(parseFloat(LINES[i].unit_price)||0);
  LINES[i].net_amount=LINES[i].amount-(LINES[i].amount*((parseFloat(LINES[i].discount_pct)||0)/100));
  if(tr)tr.querySelector('.li-amt').textContent=money(LINES[i].net_amount);
  recalc();
}

// ---- Combobox: type freely, see catalogue suggestions, click to autofill ----
// position a fixed dropdown menu right under its input, flipping up if near the bottom
function positionMenu(inp,menu){
  const r=inp.getBoundingClientRect();
  menu.style.left=r.left+'px';
  menu.style.width=Math.max(r.width,240)+'px';
  const spaceBelow=window.innerHeight-r.bottom;
  if(spaceBelow<260 && r.top>260){
    menu.style.top='';menu.style.bottom=(window.innerHeight-r.top+2)+'px';
  }else{
    menu.style.bottom='';menu.style.top=(r.bottom+2)+'px';
  }
}

function wireCombo(inp,kind){
  const i=+inp.dataset.i;
  const menu=inp.parentElement.querySelector('.cb-menu');
  const close=()=>{menu.classList.remove('open');menu.innerHTML='';};
  const open=()=>{
    const q=inp.value.toLowerCase().trim();
    let matches;
    if(kind==='cat'){
      // unique categories from products
      const seen=new Set();matches=[];
      PRODUCTS.forEach(p=>{const key=(p.category_name||'')+'|'+(p.category_code||'');
        if(seen.has(key))return;seen.add(key);
        const label=p.category_name||p.category_code||'';
        if(!q||label.toLowerCase().includes(q)||(p.category_code||'').toLowerCase().includes(q))matches.push({label,code:p.category_code,name:p.category_name});
      });
      matches=matches.slice(0,8);
    }else if(kind==='desc'){
      // Product search. The products.description column is boilerplate (2 distinct values
      // across the whole catalogue), so we search NAME + STYLE — what actually identifies a product.
      // Needs 2+ chars so the description can still be typed freely without a menu popping up.
      if(q.length<2){close();return;}
      const terms=q.split(/\s+/).filter(Boolean);
      matches=PRODUCTS.filter(p=>{
        const hay=((p.name||'')+' '+(p.style_number||'')+' '+(p.category_code||'')).toLowerCase();
        return terms.every(t=>hay.includes(t));
      }).slice(0,10);
    }else{
      // styles within the line's chosen category (if any), else all
      const cat=(LINES[i].category_name||'').toLowerCase();
      matches=PRODUCTS.filter(p=>{
        if(cat&&(p.category_name||'').toLowerCase()!==cat)return false;
        if(!q)return true;
        return (p.style_number||'').toLowerCase().includes(q)||(p.name||'').toLowerCase().includes(q);
      }).slice(0,8);
    }
    if(!matches.length){close();return;}
    positionMenu(inp,menu);
    menu.innerHTML=matches.map((m,idx)=>{
      if(kind==='cat')return `<div class="cb-opt" data-idx="${idx}"><span class="cb-main">${esc(m.label)}</span>${m.code?`<span class="cb-side">${esc(m.code)}</span>`:''}</div>`;
      if(kind==='desc'){
        const sup=m.default_supplier_id?SUPPLIERS.find(s=>s.id===m.default_supplier_id):null;
        const supTxt=sup?(sup.short_name||sup.company_name||''):'';
        return `<div class="cb-opt cb-opt-p" data-idx="${idx}">
          <div class="cbp-top"><span class="cbp-name">${esc(m.name||'')}</span><span class="cbp-price">${m.base_price!=null?'$'+Number(m.base_price).toFixed(2):''}</span></div>
          <div class="cbp-sub"><span class="cbp-sku">${esc(m.style_number||'—')}</span>${m.category_code?`<span class="cbp-dot">·</span><span>${esc(m.category_code)}</span>`:''}${supTxt?`<span class="cbp-dot">·</span><span>${esc(supTxt)}</span>`:''}</div>
        </div>`;
      }
      return `<div class="cb-opt" data-idx="${idx}"><span class="cb-main">${esc(m.style_number||'—')}</span><span class="cb-side">${esc(m.name||'')}</span></div>`;
    }).join('');
    menu.classList.add('open');
    menu.querySelectorAll('.cb-opt').forEach(opt=>opt.addEventListener('mousedown',e=>{
      e.preventDefault();const m=matches[+opt.dataset.idx];
      if(kind==='cat'){
        LINES[i].category_name=m.name||m.label;LINES[i].category_code=m.code||null;
        inp.value=m.name||m.label;
        // reset style if it no longer belongs (optional, keep simple: leave as-is)
      }else{
        LINES[i].style_number=m.style_number||'';
        LINES[i].category_name=m.category_name||LINES[i].category_name;
        LINES[i].category_code=m.category_code||LINES[i].category_code;
        LINES[i].description=m.name||LINES[i].description;
        LINES[i].unit=m.unit||LINES[i].unit||'Pc';
        LINES[i].unit_price=m.base_price!=null?m.base_price:LINES[i].unit_price;
        LINES[i].amount=(parseFloat(LINES[i].quantity)||0)*(parseFloat(LINES[i].unit_price)||0);
        LINES[i].net_amount=LINES[i].amount-(LINES[i].amount*((parseFloat(LINES[i].discount_pct)||0)/100));
        // #6 — auto-fill the supplier from the product's default (only if user hasn't already set one)
        if(ORDER.record_type==='order' && m.default_supplier_id && !LINES[i].supplier_id && !(LINES[i]._allocations&&LINES[i]._allocations.length)){
          const sup=SUPPLIERS.find(s=>s.id===m.default_supplier_id);
          if(sup){
            LINES[i].supplier_id=sup.id;
            LINES[i]._supplier_name=sup.short_name||sup.company_name||'';
            LINES[i]._supplier_number=sup.supplier_number;
            // default supplier qty to the order qty if not yet set
            if(LINES[i].supplier_quantity==null||LINES[i].supplier_quantity==='') LINES[i].supplier_quantity=parseFloat(LINES[i].quantity)||0;
          }
        }
        inp.value=(kind==='desc')?(m.name||''):(m.style_number||'');
      }
      close();renderLines();recalc();markDirty();
    }));
  };
  inp.addEventListener('focus',open);
  inp.addEventListener('input',()=>{
    if(inp.dataset.k==='description'){ LINES[i].description=inp.value; }
    else { LINES[i][inp.dataset.k==='category'?'category_name':'style_number']=inp.value; }
    if(inp.dataset.k==='category')LINES[i].category_code=null; // typed custom; clear code unless a pick sets it
    // #6 — if they typed an exact style code, auto-fill supplier from that product's default
    if(inp.dataset.k==='style' && ORDER.record_type==='order'){
      const typed=inp.value.trim().toLowerCase();
      const prod=PRODUCTS.find(p=>(p.style_number||'').toLowerCase()===typed);
      if(prod && prod.default_supplier_id && !LINES[i].supplier_id && !(LINES[i]._allocations&&LINES[i]._allocations.length)){
        const sup=SUPPLIERS.find(s=>s.id===prod.default_supplier_id);
        if(sup){
          LINES[i].supplier_id=sup.id;LINES[i]._supplier_name=sup.short_name||sup.company_name||'';LINES[i]._supplier_number=sup.supplier_number;
          if(LINES[i].supplier_quantity==null||LINES[i].supplier_quantity==='') LINES[i].supplier_quantity=parseFloat(LINES[i].quantity)||0;
          renderLines();
        }
      }
    }
    open();markDirty();
  });
  inp.addEventListener('blur',()=>setTimeout(close,120));
}

// Supplier combobox — type to search suppliers; pick one to set supplier_id + show its #ID.
function wireSupplierCombo(inp){
  const i=+inp.dataset.i;
  const menu=inp.parentElement.querySelector('.cb-menu');
  const close=()=>{menu.classList.remove('open');menu.innerHTML='';};
  const open=()=>{
    const q=inp.value.toLowerCase().trim();
    const matches=SUPPLIERS.filter(s=>{
      if(!q)return true;
      return (s.short_name||s.company_name||'').toLowerCase().includes(q)||String(s.supplier_number||'').includes(q);
    }).slice(0,8);
    if(!matches.length){close();return;}
    positionMenu(inp,menu);
    menu.innerHTML=matches.map((m,idx)=>`<div class="cb-opt" data-idx="${idx}"><span class="cb-main">${esc(m.short_name||m.company_name||'')}</span><span class="cb-side">#${esc(String(m.supplier_number||''))}</span></div>`).join('');
    menu.classList.add('open');
    menu.querySelectorAll('.cb-opt').forEach(opt=>opt.addEventListener('mousedown',e=>{
      e.preventDefault();const m=matches[+opt.dataset.idx];
      LINES[i].supplier_id=m.id;
      LINES[i]._supplier_name=m.short_name||m.company_name||'';
      LINES[i]._supplier_number=m.supplier_number;
      inp.value=LINES[i]._supplier_name;
      close();renderLines();markDirty();
      // ordering to a PO is now a deliberate action via "Order to PO" — no auto-push.
    }));
  };
  inp.addEventListener('focus',open);
  inp.addEventListener('input',()=>{
    LINES[i]._supplier_name=inp.value;
    // typed a custom name — clear the linked id unless they pick from the list
    LINES[i].supplier_id=null;LINES[i]._supplier_number=null;
    open();markDirty();
  });
  inp.addEventListener('blur',()=>setTimeout(close,120));
}

function autoGrow(el){ if(!el)return; el.style.height='auto'; el.style.height=(el.scrollHeight)+'px'; }
function addLine(){LINES.push({category_code:'',category_name:'',style_number:'',description:'',quantity:1,unit:'Pc',unit_price:0,amount:0,discount_pct:0,net_amount:0,line_order:LINES.length+1});renderLines();markDirty();}

// fulfillment colour system: placed(amber) -> in_po(red) -> issued(grey) -> received(green); backordered(violet); instock(blue); partial(amber)
const FULFILL={placed:'fs-placed',partial:'fs-partial',in_po:'fs-inpo',issued:'fs-issued',received:'fs-verified',backordered:'fs-backordered',instock:'fs-instock'};
const FULFILL_LABEL={placed:'NOT ORDERED',partial:'PARTLY ORDERED',in_po:'ORDERED',issued:'ISSUED',received:'RECEIVED',backordered:'BACK ORDER',instock:'IN STOCK'};
function fulfillState(ln){
  // lines with orders placed: derive from their allocations
  if(ln._allocations&&ln._allocations.length){
    const assigned=ln._allocations.reduce((s,a)=>s+(parseFloat(a.quantity)||0),0);
    const need=parseFloat(ln.quantity)||0;
    // surface any committed allocation status (issued/received/backordered) first
    const statuses=ln._allocations.map(a=>a.status).filter(Boolean);
    if(statuses.includes('backordered')) return 'backordered';
    if(statuses.length && statuses.every(s=>s==='received')) return 'received';
    if(statuses.includes('issued')) return 'issued';
    if(need>0 && assigned<need) return 'partial';   // not the whole order qty is on a PO yet
    return 'in_po';                                  // fully ordered into PO(s)
  }
  const fs=ln.fulfillment_status;
  if(fs&&fs!=='none'&&fs!=='in_po') return fs;        // issued/received/backordered
  if(!ln.supplier_id) return null;
  if(ln.in_po||fs==='in_po') return 'in_po';
  return 'placed';                                    // supplier set, nothing ordered yet
}
function fulfillClass(ln){const s=fulfillState(ln);return s?FULFILL[s]||'':'';}
function fulfillTag(ln){const s=fulfillState(ln);if(!s)return '';return `<span class="fs-pill fs-pill-${s}">${FULFILL_LABEL[s]||''}</span>`;}

// #4 — deleting a sales line: ordered quantities in ISSUED POs stay intact;
// quantities in OPEN POs prompt the user whether to remove those too.
async function deleteLine(i){
  const ln=LINES[i]; if(!ln){return;}
  if(ln.id){
    // find this line's allocations and their PO status
    const {data:allocs}=await db.from('quote_item_allocations').select('id,po_id,purchase_orders(status)').eq('quote_item_id',ln.id);
    const openAllocs=(allocs||[]).filter(a=>a.purchase_orders&&a.purchase_orders.status==='open');
    const issuedAllocs=(allocs||[]).filter(a=>a.purchase_orders&&a.purchase_orders.status&&a.purchase_orders.status!=='open');
    // also catch a non-split line that's directly on a PO
    let directOpen=false, directIssued=false;
    if(!allocs||!allocs.length){
      const {data:pis}=await db.from('po_items').select('id,po_id,purchase_orders(status)').eq('source_quote_item_id',ln.id);
      directOpen=(pis||[]).some(p=>p.purchase_orders&&p.purchase_orders.status==='open');
      directIssued=(pis||[]).some(p=>p.purchase_orders&&p.purchase_orders.status&&p.purchase_orders.status!=='open');
    }
    const hasOpen=openAllocs.length>0||directOpen;
    const hasIssued=issuedAllocs.length>0||directIssued;

    if(hasOpen){
      // prompt: also remove the open-PO quantities?
      const choice=await choiceModal('This line is on a purchase order',
        'This line has quantities ordered in an <b>open</b> purchase order'+(hasIssued?' (and some already issued, which will stay)':'')+'. Do you want to remove the open-PO quantities as well?',[
        {key:'yes',label:'Yes, remove the open-PO quantities too',danger:true},
        {key:'no',label:'No, keep them on the PO'},
        {key:'cancel',label:'Cancel',plain:true}
      ]);
      if(choice==='cancel'||choice==null)return;
      if(choice==='yes'){
        // delete po_items + allocations that are on OPEN POs only
        const openAllocIds=openAllocs.map(a=>a.id);
        if(openAllocIds.length){
          await db.from('po_items').delete().in('source_allocation_id',openAllocIds);
          await db.from('quote_item_allocations').delete().in('id',openAllocIds);
        }
        if(directOpen){
          // remove the direct po_items that are on open POs
          const {data:pis}=await db.from('po_items').select('id,po_id,purchase_orders(status)').eq('source_quote_item_id',ln.id);
          const delIds=(pis||[]).filter(p=>p.purchase_orders&&p.purchase_orders.status==='open').map(p=>p.id);
          if(delIds.length) await db.from('po_items').delete().in('id',delIds);
        }
      }
      // if 'no', leave open-PO lines intact (they become detached records on the PO)
    } else if(hasIssued){
      // only issued quantities -> they stay; just confirm the line removal
      const ok=await confirmModal('Remove this line?','Quantities already issued to a supplier will remain on their purchase order. The line will be removed from this order.',{confirmText:'Remove line',cancelText:'Keep'});
      if(!ok)return;
    }
    // PO records survive a quote_item delete automatically: po_items.source_*_id are
    // ON DELETE SET NULL, so the ordered lines stay on their POs (open or issued),
    // just detached. We only EXPLICITLY remove the open-PO lines if the user chose to.
    // remove the quote_item itself (its allocations cascade away; po_items keep, detached)
    await db.from('quote_items').delete().eq('id',ln.id);
  }
  LINES.splice(i,1);
  renderLines();recalc();markDirty();
}


// Each line tracks ordered qty (allocations) vs supplier qty. You can order the
// balance into open POs repeatedly until nothing is left to order.
let ORD_I=null, ORD_SUP=null, ORD_POS=[], ORD_PLACED=[], ORD_DIRECT=[];
async function openSplit(i){
  if(ORDER.record_type!=='order'){ alertModal('Sales Orders only','Ordering items to a PO is available on Sales Orders only.','info'); return; }
  const ln=LINES[i]; if(!ln){return;}
  if(!ln.id){
    // New line: quietly save so it exists in the database, then carry on into the
    // ordering panel — no bouncing the user between popups.
    await save(true);
    if(!ln.id){ alertModal('Could not save','The order needs to save before this line can be placed on a PO, and the save did not go through. Check the message in the bottom bar.','warn'); return; }
  }
  if(!ln.supplier_id){
    alertModal('Pick a supplier first','Choose the supplier for this line, then order its quantity to a purchase order.','info');
    return;
  }
  if(!(parseFloat(ln.quantity)>0)){
    alertModal('Set an order quantity','Enter the order quantity for this line first.','info');
    return;
  }
  ORD_I=i;
  ORD_SUP={id:ln.supplier_id,name:ln._supplier_name||'',num:ln._supplier_number};
  // load existing allocations (what's already been ordered) + their PO + status
  const {data:allocs}=await db.from('quote_item_allocations').select('*, purchase_orders(po_number,status,order_date)').eq('quote_item_id',ln.id).order('created_at',{ascending:true});
  ORD_PLACED=allocs||[];
  // also count any direct po_items sourced from this line that AREN'T tied to an allocation
  // (so the balance reflects every PO line ever created for this product, per spec).
  const {data:directPis}=await db.from('po_items').select('id,quantity,po_id,source_allocation_id,purchase_orders(po_number,status,order_date)').eq('source_quote_item_id',ln.id);
  ORD_DIRECT=(directPis||[]).filter(p=>!p.source_allocation_id);
  // load this supplier's OPEN POs to order more into
  const {data:pos}=await db.from('purchase_orders').select('id,po_number,order_date').eq('status','open').eq('supplier_id',ORD_SUP.id).order('po_number');
  ORD_POS=pos||[];
  renderOrderModal();
  document.getElementById('split-overlay').classList.add('open');
}
function closeSplit(){document.getElementById('split-overlay').classList.remove('open');ORD_I=null;}
function orderedSum(){
  const allocSum=ORD_PLACED.reduce((s,a)=>s+(parseFloat(a.quantity)||0),0);
  const directSum=ORD_DIRECT.reduce((s,p)=>s+(parseFloat(p.quantity)||0),0);
  return allocSum+directSum;
}
function renderOrderModal(){
  const ln=LINES[ORD_I]; if(!ln)return;
  const need=parseFloat(ln.quantity)||0;
  const ordered=orderedSum();
  const balance=Math.max(0,need-ordered);
  const fmt=d=>{ if(!d)return ''; const x=new Date(d+'T00:00:00'); return x.toLocaleDateString('en-CA',{month:'short',day:'numeric'}); };

  document.getElementById('split-meta').innerHTML=`<b>${esc(ln.description||ln.style_number||'Line item')}</b><br>Supplier: <b>${esc(ORD_SUP.name||'—')}</b>${ORD_SUP.num?` (#${esc(String(ORD_SUP.num))})`:''}`;

  // balance banner
  const bEl=document.getElementById('order-balance');
  bEl.className='order-balance'+(balance===0?' done':'');
  bEl.innerHTML=`<div class="ob-grid">
      <div class="ob-cell"><span class="ob-n">${need}</span><span class="ob-l">Order Qty</span></div>
      <div class="ob-cell"><span class="ob-n">${ordered}</span><span class="ob-l">Ordered</span></div>
      <div class="ob-cell hl"><span class="ob-n">${balance}</span><span class="ob-l">Still to Order</span></div>
    </div>`;

  // placed orders ledger (allocations + any direct PO lines)
  const pl=document.getElementById('placed-list');
  const allocRows=ORD_PLACED.map(a=>{
    const po=a.purchase_orders||{};
    const locked=po.status&&po.status!=='open';
    return `<div class="pl-row">
      <div class="pl-l"><b>${parseFloat(a.quantity)||0}</b> units → PO #${po.po_number||'—'} <span class="pl-st pl-${(po.status||'open')}">${esc(po.status||'open')}</span></div>
      ${locked?'<span class="pl-lock">issued</span>':`<button class="pl-remove" data-aid="${a.id}" data-pid="${a.po_id||''}">remove</button>`}
    </div>`;
  });
  const directRows=ORD_DIRECT.map(p=>{
    const po=p.purchase_orders||{};
    const locked=po.status&&po.status!=='open';
    return `<div class="pl-row">
      <div class="pl-l"><b>${parseFloat(p.quantity)||0}</b> units → PO #${po.po_number||'—'} <span class="pl-st pl-${(po.status||'open')}">${esc(po.status||'open')}</span></div>
      ${locked?'<span class="pl-lock">issued</span>':`<button class="pl-remove-direct" data-pid2="${p.id}">remove</button>`}
    </div>`;
  });
  const allRows=allocRows.concat(directRows);
  if(allRows.length){
    pl.innerHTML='<div class="pl-h">Already ordered</div>'+allRows.join('');
  }else{
    pl.innerHTML='<div class="pl-empty">Nothing ordered yet.</div>';
  }

  // order-more form
  const form=document.getElementById('order-form');
  if(balance<=0){
    form.style.display='none';
  }else{
    form.style.display='';
    const qi=document.getElementById('of-qty');qi.value=balance;qi.max=balance;
    const sel=document.getElementById('of-po');
    if(ORD_POS.length){
      sel.innerHTML=ORD_POS.map(p=>`<option value="${p.id}">PO #${p.po_number}${p.order_date?' · '+fmt(p.order_date):''}</option>`).join('');
      sel.disabled=false;
      document.getElementById('of-add').disabled=false;
      document.getElementById('split-msg').innerHTML='';
    }else{
      sel.innerHTML='<option value="">No open PO for this supplier</option>';
      sel.disabled=true;
      document.getElementById('of-add').disabled=true;
      document.getElementById('split-msg').innerHTML='<span style="color:var(--text-3)">No open PO for '+esc(ORD_SUP.name)+' yet.</span> <button type="button" id="of-newpo" class="alloc-btn" style="margin:0 0 0 8px;">＋ Create open PO</button>';
    }
  }
  // wire remove buttons
  pl.querySelectorAll('.pl-remove').forEach(btn=>btn.addEventListener('click',()=>removePlaced(btn.dataset.aid,btn.dataset.pid)));
  pl.querySelectorAll('.pl-remove-direct').forEach(btn=>btn.addEventListener('click',()=>removeDirect(btn.dataset.pid2)));
}
async function addOrderToPO(){
  const ln=LINES[ORD_I]; if(!ln)return;
  const need=parseFloat(ln.quantity)||0;
  const balance=need-orderedSum();
  const qty=parseFloat(document.getElementById('of-qty').value)||0;
  const poId=document.getElementById('of-po').value;
  const msg=document.getElementById('split-msg');
  if(!(qty>0)){msg.textContent='Enter a quantity greater than 0.';return;}
  if(qty>balance){msg.textContent='You can order at most '+balance+' more — the order quantity is '+need+' and '+orderedSum()+' is already on a PO.';return;}
  if(!poId){msg.textContent='Choose which open PO to order into.';return;}
  // 1) create the allocation (the order record)
  const {data:alloc,error:ae}=await db.from('quote_item_allocations').insert({
    quote_item_id:ln.id, supplier_id:ORD_SUP.id, quantity:qty, in_po:true, po_id:poId, status:'in_po'
  }).select().single();
  if(ae){msg.textContent='Could not save: '+ae.message;return;}
  // 2) add the matching po_item to the chosen PO
  await db.from('po_items').insert({
    po_id:poId, source_quote_item_id:null, source_allocation_id:alloc.id,
    style_number:ln.style_number||null, category_name:ln.category_name||null,
    part_no:ln.style_number||null, product_name:ln.description||null, description:ln.description||null,
    quantity:qty, rate:Number(ln.unit_price)||0, amount:qty*(Number(ln.unit_price)||0),
    ordered_for:ORDER.stage_id?String(ORDER.stage_id):null, status:'issued'
  });
  // 3) reflect on the line (it now has at least one ordered portion)
  await db.from('quote_items').update({in_po:true,po_id:poId,fulfillment_status:'in_po'}).eq('id',ln.id);
  // refresh the modal's data
  const {data:allocs}=await db.from('quote_item_allocations').select('*, purchase_orders(po_number,status,order_date)').eq('quote_item_id',ln.id).order('created_at',{ascending:true});
  ORD_PLACED=allocs||[];
  msg.textContent='';

}

function recalc(){
  const sub=LINES.reduce((s,l)=>s+(parseFloat(l.amount)||0),0);
  const disc=LINES.reduce((s,l)=>s+((parseFloat(l.amount)||0)*((parseFloat(l.discount_pct)||0)/100)),0);
  const net=sub-disc;const hst=net*HST_RATE;const grand=net+hst;
  document.getElementById('t-sub').textContent=money(sub);
  document.getElementById('t-disc').textContent=disc>0?'−'+money(disc):money(0);
  document.getElementById('t-hst').textContent=money(hst);
  document.getElementById('t-grand').textContent=money(grand);
  ORDER._calc={subtotal:sub,discount_total:disc,hst,grand_total:grand};
  updateSummary();
}

async function save(silent){
  if(!MGMT) return;   // process users are read-only; RLS blocks the write server-side too.

  // ── Optimistic lock ───────────────────────────────────────────────
  // Atomically stamp the record, but ONLY if nobody has saved it since we
  // loaded. If they have, this raises and we stop before overwriting them.
  if(ORDER_ID && LOADED_AT !== undefined){
    const {data:newTs, error:lockErr} = await db.rpc('claim_save',{p_id:ORDER_ID, p_expected:LOADED_AT});
    if(lockErr){
      const msg = lockErr.message || '';
      if(/CONFLICT/i.test(msg)){
        await smAlert(msg.replace(/^.*CONFLICT:\s*/,''), 'Someone else changed this order', 'warn');
        location.reload();
        return;
      }
      await smAlert(msg || 'Could not save.', 'Save failed', 'danger');
      return;
    }
    LOADED_AT = newTs;   // we now own the latest version
  }
  // (The old "Supplier quantity required" gate is gone: the allocation flow — Order
  //  to PO with an explicit quantity — replaced supplier_quantity, and save() below
  //  mirrors it from the order qty on every write. The gate referenced a field the
  //  UI no longer has and could deadlock saving on legacy rows.)
  const msg=document.getElementById('save-msg');
  if(msg){msg.textContent=silent?'Adding to open PO…':'Saving…';msg.className='status-msg';}
  const c=ORDER._calc||{};
  // 1. update the quote
  const {error:e1}=await db.from('quotes').update({
    client_id:ORDER.client_id,contact_id:ORDER.contact_id,subject:ORDER.subject,serviced_by:ORDER.serviced_by,record_type:ORDER.record_type,
    po_number:ORDER.po_number,quote_date:ORDER.quote_date,ship_mode:ORDER.ship_mode,
    art_status:ORDER.art_status,pickup_date:ORDER.pickup_date,event_date:ORDER.event_date,sent_status:ORDER.sent_status,
    active_status:ORDER.active_status,lost_reason:ORDER.lost_reason||null,lost_at:ORDER.lost_at||null,
    subtotal:c.subtotal||0,discount_total:c.discount_total||0,
    hst:c.hst||0,grand_total:c.grand_total||0
  }).eq('id',ORDER_ID);
  if(e1){if(msg){msg.textContent='Error: '+e1.message;msg.className='status-msg err';}return;}

  // 2. UPDATE-IN-PLACE line items — never destroy fulfillment fields (in_po, po_id, fulfillment_status)
  //    a) figure out which existing rows were removed in the UI, and delete only those
  const {data:existing}=await db.from('quote_items').select('id').eq('quote_id',ORDER_ID);
  const existingIds=new Set((existing||[]).map(r=>r.id));
  const keptIds=new Set(LINES.filter(l=>l.id).map(l=>l.id));
  const toDelete=[...existingIds].filter(id=>!keptIds.has(id));
  if(toDelete.length){
    // also remove any PO items sourced from these deleted lines (from OPEN POs only —
    // sent POs are locked records). Their allocations go too.
    const {data:delAllocs}=await db.from('quote_item_allocations').select('id').in('quote_item_id',toDelete);
    const delAllocIds=(delAllocs||[]).map(a=>a.id);
    // find po_items linked to these quote_items or their allocations
    let linked=[];
    const {data:byItem}=await db.from('po_items').select('id,po_id').in('source_quote_item_id',toDelete);
    linked=linked.concat(byItem||[]);
    if(delAllocIds.length){
      const {data:byAlloc}=await db.from('po_items').select('id,po_id').in('source_allocation_id',delAllocIds);
      linked=linked.concat(byAlloc||[]);
    }
    if(linked.length){
      // keep only those on OPEN purchase orders
      const poIds=[...new Set(linked.map(p=>p.po_id))];
      const {data:openPOs}=await db.from('purchase_orders').select('id').eq('status','open').in('id',poIds);
      const openSet=new Set((openPOs||[]).map(p=>p.id));
      const poItemIds=linked.filter(p=>openSet.has(p.po_id)).map(p=>p.id);
      if(poItemIds.length) await db.from('po_items').delete().in('id',poItemIds);
    }
    if(delAllocIds.length) await db.from('quote_item_allocations').delete().in('id',delAllocIds);
    await db.from('quote_items').delete().in('id',toDelete);
  }

  //    b) update existing rows, insert new ones. Fulfillment fields are intentionally omitted.
  let insertedItems=[];
  for(let idx=0; idx<LINES.length; idx++){
    const l=LINES[idx];
    const base={quote_id:ORDER_ID,line_order:idx+1,category_code:l.category_code||null,
      category_name:l.category_name||null,style_number:l.style_number||null,description:l.description||null,
      quantity:parseFloat(l.quantity)||0,unit:l.unit||'Pc',unit_price:parseFloat(l.unit_price)||0,
      amount:parseFloat(l.amount)||0,discount_pct:parseFloat(l.discount_pct)||0,net_amount:parseFloat(l.net_amount)||0,
      supplier_id:l.supplier_id||null,
      supplier_quantity:parseFloat(l.quantity)||0};   // basis is order qty now; mirror it
    if(l.id && existingIds.has(l.id)){
      // existing row -> UPDATE (do NOT touch in_po, po_id, fulfillment_status)
      await db.from('quote_items').update(base).eq('id',l.id);
      insertedItems.push({...l, ...base, id:l.id});
    }else{
      // brand-new row -> insert (starts with no fulfillment)
      const {data:ins}=await db.from('quote_items').insert({...base,in_po:false,po_id:null,fulfillment_status:'none'}).select().single();
      if(ins){ l.id=ins.id; insertedItems.push(ins); }
    }
  }

  //    c) allocations are AUTHORITATIVE and owned entirely by the ordering flows
  //       ("Order to PO", batch, receiving). Save must never rebuild them: the old
  //       delete-and-reinsert here downgraded committed allocations to 'pending',
  //       released the line, and orphaned PO items via the SET NULL foreign key.

  //    d) for lines already in an OPEN (not yet sent) PO, push supplier-qty edits
  //       through to the matching po_item so the PO stays in sync immediately.
  for(let idx=0; idx<LINES.length; idx++){
    const l=LINES[idx];
    if(!l.id || !l.in_po || !l.po_id) continue;
    // allocation-managed lines (ordered via "Order to PO" / batch) are owned by their
    // allocations — never touch them here, or a save could silently unlink them.
    if(l._allocations && l._allocations.length) continue;
    // only if that PO is still open (sent POs are locked records)
    const {data:po}=await db.from('purchase_orders').select('status').eq('id',l.po_id).single();
    if(!po || po.status!=='open') continue;
    // missing supplier qty means "mirror the order qty" (save writes it that way) —
    // it must NOT read as 0, which released the line from its PO on every save.
    const supQty=(l.supplier_quantity!=null&&l.supplier_quantity!=='')?(parseFloat(l.supplier_quantity)||0):(parseFloat(l.quantity)||0);
    if(supQty<=0){
      // supplier qty cleared / set to in-stock -> remove from the PO and release the line
      await db.from('po_items').delete().eq('po_id',l.po_id).eq('source_quote_item_id',l.id);
      await db.from('quote_items').update({in_po:false,po_id:null,fulfillment_status:'none'}).eq('id',l.id);
      l.in_po=false;l.po_id=null;l.fulfillment_status='none';
    }else{
      const rate=parseFloat(l.unit_price)||0;
      await db.from('po_items').update({quantity:supQty, amount:supQty*rate, product_name:l.description||null, part_no:l.style_number||null}).eq('po_id',l.po_id).eq('source_quote_item_id',l.id);
    }
  }

  // Ordering to a PO is now manual (via "Order to PO"), so save no longer
  // auto-pushes line items into POs.

  // The quotes UPDATE above re-bumped modified_at via the touch_modified
  // trigger, so the timestamp claim_save handed us is already stale.
  // Re-read it, or the NEXT save in this session false-conflicts with
  // our own write ("Someone else changed this order").
  if(ORDER_ID){
    const {data:_fresh}=await db.from('quotes').select('modified_at').eq('id',ORDER_ID).single();
    if(_fresh && _fresh.modified_at) LOADED_AT=_fresh.modified_at;
  }
  DIRTY=false;
  if(msg){msg.textContent='Saved ✓';msg.className='status-msg saved';}
  // reload to reflect current fulfillment state
  await reloadLines();
}

// When a supplier with an open PO is chosen on a sales order, auto-save so the
// line flows into that PO immediately — the user doesn't have to click Save.
async function maybeAutoSyncPO(supplierId){
  if(ORDER.record_type!=='order')return;
  if(!supplierId)return;
  const {data:openPOs}=await db.from('purchase_orders').select('id').eq('status','open').eq('supplier_id',supplierId);
  if(!openPOs||!openPOs.length)return;   // no open PO -> on-save warning handles it
  // If the line that just got this supplier has no supplier qty yet, default it to the
  // order qty so the item is eligible to flow into the PO (qty 0 stays In Stock).
  LINES.forEach(l=>{ if(l.supplier_id===supplierId && (l.supplier_quantity==null||l.supplier_quantity==='')){ l.supplier_quantity=parseFloat(l.quantity)||0; } });
  // Save silently — this runs syncToPOs, which (for >1 open PO) opens the picker immediately.
  await save(true);
}

// Push each line that has a supplier with an OPEN PO into that PO. Returns {warnings, needsPOChoice}.
// Only items NOT already linked to a PO (in_po=false) and with supplier_quantity>0 are moved.
// Items with supplier_quantity===0 are "In Stock" and never go to a PO.
async function syncToPOs(insertedItems){
  const warnings=[];
  const needsChoice=[];   // suppliers with >1 open PO -> user must pick (handled by caller)
  if(ORDER.record_type!=='order') return warnings;

  // reload current fulfillment state of these items so we never touch ones already in a PO
  const ids=insertedItems.map(it=>it.id).filter(Boolean);
  let stateById={};
  if(ids.length){
    const {data:cur}=await db.from('quote_items').select('id,in_po,supplier_id,supplier_quantity,quantity,unit_price,style_number,description,fulfillment_status').in('id',ids);
    (cur||[]).forEach(r=>stateById[r.id]=r);
  }

  // find which items are split (have allocations) — those go via allocations ONLY,
  // so the parent line item must NOT also be pushed (that caused duplicates).
  let allocItemIds=new Set();
  let allAllocs=[];
  if(ids.length){
    const {data:al}=await db.from('quote_item_allocations').select('*').in('quote_item_id',ids);
    allAllocs=al||[];
    allAllocs.forEach(a=>allocItemIds.add(a.quote_item_id));
  }

  const bySup={};
  insertedItems.forEach(it=>{
    const st=stateById[it.id]||it;
    if(st.in_po) return;                                  // already linked -> never re-touch
    if(allocItemIds.has(it.id)) return;                   // split line -> handled by its allocations only
    const supQty=st.supplier_quantity!=null?Number(st.supplier_quantity):Number(st.quantity);
    if(!st.supplier_id || !(supQty>0)) return;            // no supplier, or In-Stock(0) -> skip
    (bySup[st.supplier_id]=bySup[st.supplier_id]||[]).push({type:'item',style_number:st.style_number,description:st.description,quantity:supQty,unit_price:Number(st.unit_price),id:it.id});
  });

  // allocations (split) not yet in a PO
  {
    const itemById={};insertedItems.forEach(it=>itemById[it.id]=stateById[it.id]||it);
    allAllocs.forEach(a=>{
      if(a.in_po) return;
      if(!a.supplier_id||!(Number(a.quantity)>0))return;
      const it=itemById[a.quote_item_id]||{};
      (bySup[a.supplier_id]=bySup[a.supplier_id]||[]).push({type:'alloc',ref:a,style_number:it.style_number,description:it.description,quantity:Number(a.quantity),unit_price:Number(it.unit_price),id:a.id});
    });
  }

  const supIds=Object.keys(bySup);
  if(!supIds.length)return warnings;

  // find OPEN POs per supplier — there may be more than one
  const {data:openPOs}=await db.from('purchase_orders').select('id,po_number,supplier_id,order_date').eq('status','open').in('supplier_id',supIds).order('po_number');
  const posBySup={};(openPOs||[]).forEach(p=>{(posBySup[p.supplier_id]=posBySup[p.supplier_id]||[]).push(p);});

  for(const sid of supIds){
    const pos=posBySup[sid]||[];
    const sup=SUPPLIERS.find(s=>s.id===sid);
    const supName=sup?(sup.company_name||sup.short_name):'this supplier';
    if(pos.length===0){
      warnings.push(supName);
      continue;
    }
    const entries=bySup[sid];
    // entries that already specify a PO (from the split modal) go straight there
    const preAssigned=entries.filter(e=>e.ref&&e.ref.po_id);
    for(const e of preAssigned){
      const po=pos.find(p=>p.id===e.ref.po_id);
      if(po) await addEntriesToPO(po,[e]);
    }
    const rest=entries.filter(e=>!(e.ref&&e.ref.po_id));
    if(!rest.length) continue;
    if(pos.length===1){
      await addEntriesToPO(pos[0], rest);
    }else{
      // >1 open PO and these entries haven't chosen one -> ask the user (per line)
      needsChoice.push({supplier_id:sid, supplier_name:supName, pos, entries:rest});
    }
  }
  // hand any "choose a PO" cases back to the caller
  syncToPOs._needsChoice=needsChoice;
  return warnings;
}

// Insert the given entries into a specific PO and mark sources in_po (red).
async function addEntriesToPO(po, entries){
  if(!entries.length)return;
  // Guard against duplicates: never insert an item/allocation that already has a
  // po_item anywhere. (syncToPOs can run several times per save — silent auto-save
  // on supplier pick, the manual save, realtime reloads — so the insert must be idempotent.)
  const itemIds=entries.filter(e=>e.type==='item').map(e=>e.id);
  const allocIds=entries.filter(e=>e.type==='alloc').map(e=>e.id);
  const existItem=new Set(), existAlloc=new Set();
  if(itemIds.length){
    const {data}=await db.from('po_items').select('source_quote_item_id').in('source_quote_item_id',itemIds);
    (data||[]).forEach(r=>existItem.add(r.source_quote_item_id));
  }
  if(allocIds.length){
    const {data}=await db.from('po_items').select('source_allocation_id').in('source_allocation_id',allocIds);
    (data||[]).forEach(r=>existAlloc.add(r.source_allocation_id));
  }
  const fresh=entries.filter(e=> e.type==='alloc' ? !existAlloc.has(e.id) : !existItem.has(e.id));
  if(!fresh.length)return;   // everything already in a PO -> nothing to do
  const poRows=fresh.map((entry,idx)=>({
    po_id:po.id, line_order:idx+1,
    source_quote_item_id:entry.type==='item'?entry.id:(entry.ref.quote_item_id||null),
    source_allocation_id:entry.type==='alloc'?entry.id:null,
    style_number:entry.style_number||null, category_name:null,
    part_no:entry.style_number||null, product_name:entry.description||null, description:entry.description||null,
    quantity:entry.quantity, rate:entry.unit_price||0, amount:entry.quantity*(entry.unit_price||0),
    ordered_for:ORDER.stage_id?String(ORDER.stage_id):null, status:'issued'
  }));
  const {error}=await db.from('po_items').insert(poRows);
  if(error)return;
  const fItemIds=fresh.filter(e=>e.type==='item').map(e=>e.id);
  if(fItemIds.length) await db.from('quote_items').update({in_po:true,po_id:po.id,fulfillment_status:'in_po'}).in('id',fItemIds);
  const fAllocIds=fresh.filter(e=>e.type==='alloc').map(e=>e.id);
  if(fAllocIds.length) await db.from('quote_item_allocations').update({in_po:true,po_id:po.id,status:'in_po'}).in('id',fAllocIds);
}

// #9/#2 — single combined popup: lists every entry that needs a PO choice, each
// with its own PO dropdown. The user assigns all of them, then confirms once.
function resolvePOChoices(choices){
  return new Promise(resolve=>{
    const ov=document.getElementById('popick-overlay');
    const fmt=d=>{ if(!d)return ''; const x=new Date(d+'T00:00:00'); return x.toLocaleDateString('en-CA',{month:'short',day:'numeric'}); };
    // flatten: one assignable row per entry, carrying its supplier's PO options
    const rows=[];
    choices.forEach(c=>{ c.entries.forEach(e=>{ rows.push({entry:e, pos:c.pos, supplier_name:c.supplier_name, po_id:''}); }); });
    document.getElementById('popick-meta').innerHTML=`These line items can go to more than one open purchase order. Choose where each one goes:`;
    document.getElementById('popick-list').innerHTML=rows.map((r,idx)=>{
      const label=(r.entry.description||r.entry.style_number||'Line item');
      const qty=r.entry.quantity!=null?` · qty ${r.entry.quantity}`:'';
      return `<div class="popick-line">
        <div class="pl-info"><div class="pl-name">${esc(label)}</div><div class="pl-sub">${esc(r.supplier_name)}${qty}</div></div>
        <select class="pl-po" data-idx="${idx}"><option value="">— choose PO —</option>${r.pos.map(p=>`<option value="${p.id}">PO #${p.po_number}${p.order_date?' · '+fmt(p.order_date):''}</option>`).join('')}</select>
      </div>`;
    }).join('');
    document.getElementById('popick-list').querySelectorAll('.pl-po').forEach(sel=>sel.addEventListener('change',()=>{rows[+sel.dataset.idx].po_id=sel.value||'';}));
    const msg=document.getElementById('popick-msg');msg.textContent='';
    const confirmBtn=document.getElementById('popick-confirm');
    const skipBtn=document.getElementById('popick-skip');
    const finish=async(assignAll)=>{
      if(assignAll){
        if(rows.some(r=>!r.po_id)){ msg.textContent='Choose a PO for every line, or use “Skip for now”.'; return; }
        // group entries by chosen PO and insert
        for(const r of rows){
          const po=r.pos.find(p=>p.id===r.po_id);
          if(po) await addEntriesToPO(po,[r.entry]);
        }
      }
      ov.classList.remove('open'); resolve();
    };
    confirmBtn.onclick=()=>finish(true);
    skipBtn.onclick=()=>finish(false);
    ov.classList.add('open');
  });
}

async function reloadLines(){
  const {data:items}=await db.from('quote_items').select('*').eq('quote_id',ORDER_ID).order('line_order');
  LINES=items||[];
  LINES.forEach(l=>{ if(l.supplier_id){ const s=SUPPLIERS.find(x=>x.id===l.supplier_id); if(s){ l._supplier_name=s.short_name||s.company_name||''; l._supplier_number=s.supplier_number; } } });
  await loadAllocations();
  renderLines();recalc();
}

async function printQuotation(){
  if(!LINES.length){await alertModal('Nothing to print','Add at least one line item before printing a quotation.','warn');return;}
  const choice=await choiceModal('Quotation #'+ORDER.stage_id,'How would you like to output it?',[
    {key:'pdf',label:'Save as PDF',primary:true},
    {key:'print',label:'Print'},
    {key:'cancel',label:'Cancel',plain:true}
  ]);
  if(!choice||choice==='cancel')return;
  let mod;
  try{ mod=await import('./pdf.js'); }
  catch(err){ await alertModal('Couldn’t load','The PDF generator (pdf.js) didn’t load.','danger'); return; }
  const c=ORDER.clients||{}; const ct=ORDER.contacts||{};
  const lines=[c.bill_address,c.bill_city,c.bill_postal,c.bill_province].filter(Boolean);
  const calc=ORDER._calc||{subtotal:ORDER.subtotal,hst:ORDER.hst,grandTotal:ORDER.grand_total};
  const payload={
    number:String(ORDER.stage_id), date:ORDER.quote_date, servicedBy:ORDER.serviced_by||'',
    clientContact:((ct.first_name||'')+' '+(ct.last_name||'')).trim(), pageNo:1,
    client:{company:c.company_name||'', lines, tel:ct.tel1||'', email:ct.email1||''},
    items:LINES.map(l=>({category:l.category_name||l.category_code||'',code:l.style_number||'',description:l.description||'',qty:l.quantity,unit:l.unit||'Pc',unitPrice:l.unit_price,amount:l.amount,discountPct:l.discount_pct||0})),
    subtotal:calc.subtotal||0, hst:calc.hst||0, grandTotal:calc.grand_total||calc.grandTotal||0
  };
  if(choice==='print'){ mod.printDoc('QUOTATION',payload); return; }
  // PDF: keep offering the save until it succeeds or the user gives up
  while(true){
    const saved=await mod.makePDF('QUOTATION',payload);
    if(!saved)return; // user cancelled the OS save dialog
    const done=await confirmModal('Quotation saved','Did the quotation save successfully?',{confirmText:'Complete',cancelText:'Not yet'});
    if(done){
      // A completed PDF means the quote went to the client — record it so the
      // timeline can start the follow-up clock. Goes through save() to respect
      // the concurrent-edit lock.
      if(MGMT && ORDER.record_type==='quote' && ORDER.sent_status!=='sent'){
        ORDER.sent_status='sent';
        try{ await save(true); }catch(e){}
      }
      location.href='index.html'; return;
    }
    // "Not yet" -> loop and re-open the save dialog
  }
}

async function deleteOrder(){
  // Deletion is intentionally disabled. Records are permanent to keep the
  // Sales Timeline serial-number sequence intact. To retire a record without
  // losing its ID, clear its client (it will then be offered for reuse on
  // the next New Record).
  await alertModal(
    'Records cannot be deleted',
    'To keep the Sales Timeline serial numbers intact, records are permanent. If you want to retire this one without wasting its ID, clear its client — it will be offered for reuse next time you click New Record.',
    'info'
  );
}

async function convertToInvoice(){
  if(DIRTY){ const s=await confirmModal('Save first?','You have unsaved changes. They’ll be saved before creating the invoice.',{confirmText:'Save & continue',cancelText:'Cancel'}); if(!s)return; await save(); }
  // One prompt only: the irreversibility confirmation.
  const ok=await confirmModal('Convert to invoice — this cannot be undone',
    'This turns order #'+ORDER.stage_id+' into an invoice. Once converted:<br><br>'
    +'• the invoice becomes <strong>read-only</strong> — no more edits to line items, prices, or quantities<br>'
    +'• the order leaves the Sales Timeline<br>'
    +'• this <strong>cannot be reversed</strong><br><br>'
    +'Make sure everything is correct before continuing.',
    {confirmText:'Yes, convert to invoice',cancelText:'Cancel',danger:true});
  if(!ok)return;
  const c=ORDER._calc||{subtotal:ORDER.subtotal,discount_total:ORDER.discount_total,hst:ORDER.hst,grand_total:ORDER.grand_total};
  const {data:seq,error:se}=await db.rpc('nextval_invoice');
  let invNum=null;
  if(se||seq==null){ const {data:mx}=await db.from('invoices').select('invoice_number').order('invoice_number',{ascending:false}).limit(1); invNum=(mx&&mx[0]&&mx[0].invoice_number?mx[0].invoice_number:20000)+1; }
  else invNum=seq;
  const invDate=new Date();
  const dueDate=new Date(invDate.getTime()+30*86400000);   // Net 30 by default
  const {data:inv,error}=await db.from('invoices').insert({
    invoice_number:invNum, quote_id:ORDER_ID, client_id:ORDER.client_id, subject:ORDER.subject,
    serviced_by:ORDER.serviced_by, invoice_date:invDate.toISOString().slice(0,10),
    terms:'net_30', due_date:dueDate.toISOString().slice(0,10),
    subtotal:c.subtotal||0, discount_total:c.discount_total||0, hst:c.hst||0, grand_total:c.grand_total||0,
    balance_due:c.grand_total||0, paid_status:'unpaid'
  }).select().single();
  if(error){await alertModal('Couldn’t create invoice',error.message,'danger');return;}
  // Apply deposits taken on this order as payments on the new invoice.
  // record_payment is atomic and recomputes paid/balance/status server-side;
  // stamping applied_invoice_id ensures a deposit can never apply twice.
  for(const d of (DEPOSITS||[]).filter(x=>!x.applied_invoice_id)){
    const {error:pe}=await db.rpc('record_payment',{p_invoice:inv.id,p_amount:Number(d.amount),p_method:d.method||'Deposit',p_date:d.dep_date,p_ref:d.reference||('Deposit on order #'+ORDER.stage_id)});
    if(!pe){ await db.from('order_deposits').update({applied_invoice_id:inv.id}).eq('id',d.id); }
  }
  // remove the order from the Sales Timeline: flip record_type to 'invoice'
  // (the timeline only shows inquiry/quote/order) and mark it completed.
  const {error:upErr}=await db.from('quotes').update({record_type:'invoice',art_status:'invoice',active_status:'completed'}).eq('id',ORDER_ID);
  if(upErr){ await alertModal('Invoice created, but…','The invoice was created but the order could not be moved off the timeline: '+upErr.message,'warn'); }
  location.href='invoices.html?open='+encodeURIComponent(inv.id);
}

function label(s){return {send_art:'Send Art',approval_due:'Approval Due',approved:'Approved',in_process:'In Process',invoice:'Invoice',no_data:'No Data'}[s]||s;}

// Intercept "Inbox" back link and Cancel button to use an in-app unsaved-changes prompt.
// Three options: save & leave, leave without saving, or stay. (You're never trapped.)
async function guardedLeave(dest){
  if(DIRTY){
    const choice=await choiceModal('Unsaved changes','You have unsaved changes on this record. What would you like to do?',[
      {key:'save',label:'Save changes & leave',primary:true},
      {key:'leave',label:'Leave without saving'},
      {key:'stay',label:'Stay on this page',plain:true}
    ]);
    if(choice==='stay'||choice==null) return;
    if(choice==='save'){ await save(); }      // auto-save then leave
    DIRTY=false;
  }
  location.href=dest;
}
{
  const back=document.querySelector('.topbar .back');
  if(back)back.addEventListener('click',e=>{e.preventDefault();guardedLeave('index.html');});
  const cancel=document.getElementById('btn-cancel');
  if(cancel)cancel.addEventListener('click',e=>{e.preventDefault();guardedLeave('index.html');});
}

// (native "Leave site?" beforeunload prompt intentionally removed — the in-app
//  navigation guard above handles unsaved changes with a styled three-option prompt.)
// ── Presence: who else is in this record right now ────────────────
let PRESENCE_TIMER=null;
async function startPresence(){
  if(!ORDER_ID || !MGMT) return;
  const beat=async()=>{
    try{
      await db.rpc('touch_presence',{p_quote:ORDER_ID});
      const {data}=await db.rpc('who_is_editing',{p_quote:ORDER_ID});
      showPresence((data||[]).map(x=>x.full_name));
    }catch(e){ /* presence is advisory; never block the page on it */ }
  };
  await beat();
  PRESENCE_TIMER=setInterval(beat, 30000);   // rows go stale after 90s
}
function showPresence(names){
  let bar=document.getElementById('presence-bar');
  if(!names.length){ if(bar) bar.remove(); return; }
  if(!bar){
    bar=document.createElement('div'); bar.id='presence-bar'; bar.className='presence-bar';
    const w=document.getElementById('wrap'); if(w) w.prepend(bar); else return;
  }
  const who=names.join(' and ');
  bar.innerHTML='<span class="pb-dot"></span><span class="pb-t"><strong>'+esc(who)+'</strong> '
    +(names.length>1?'are':'is')+' editing this order right now. Save last and you may be asked to reload.</span>';
}
window.addEventListener('beforeunload',()=>{
  if(PRESENCE_TIMER) clearInterval(PRESENCE_TIMER);
  if(ORDER_ID && MGMT){ try{ db.rpc('clear_presence',{p_quote:ORDER_ID}); }catch(e){} }
});

// Ctrl/Cmd+S saves instead of triggering the browser's save-page dialog.
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){
    e.preventDefault();
    if(MGMT&&DIRTY) save();
  }
});

load().then(startPresence);
// live sync: if another screen changes this order's fulfillment, refresh the line
// colours — but never while the user has unsaved edits (would clobber their work).
subscribeFulfillment(async()=>{
  if(DIRTY) return;                 // don't interrupt active editing
  if(document.getElementById('split-overlay')?.classList.contains('open')) return;
  if(document.getElementById('popick-overlay')?.classList.contains('open')) return;
  await reloadLines();
});
</script>
