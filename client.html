<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client — YRT CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1115;--bg-2:#16181d;--bg-3:#1f2229;--bg-4:#2a2e37;
    --line:#323a48;--line-2:#414a5c;--text:#eef0f4;--text-2:#c4cad6;--text-3:#9098a8;
    --brass:#e7ebf3;--brass-2:#f4f6fb;--star:#ffb627;--approved:#3ddc84;--danger:#ff4d4d;
    --art:#ff6b35;--due:#ffb627;--process:#3da5ff;--invoice:#b06bff;
    --radius:11px;--radius-sm:8px;
    --fd:'Archivo',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif;--fm:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--fb);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  ::-webkit-scrollbar{width:10px;height:10px;}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px;border:2px solid var(--bg);}
  .topbar{height:58px;background:var(--bg-2);border-bottom:2px solid var(--line-2);display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:30;}
  .back{display:inline-flex;align-items:center;gap:7px;color:var(--text-2);text-decoration:none;font-weight:700;font-size:13px;padding:7px 11px;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--bg-3);}
  .back:hover{border-color:var(--brass);color:var(--brass-2);}
  .title{font-family:var(--fd);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:16px;}
  .actions{margin-left:auto;display:flex;gap:8px;}
  .btn{padding:8px 14px;border-radius:var(--radius-sm);font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;border:1px solid var(--line-2);background:var(--bg-3);color:var(--text);}
  .btn:hover{border-color:var(--brass);}
  .btn-brass{background:linear-gradient(135deg,#f4f6fb,#d4dae6);color:#15171c;border:none;}
  .btn-brass:hover{filter:brightness(1.08);}
  .wrap{max-width:1400px;margin:0 auto;padding:18px 24px;height:calc(100vh - 58px);display:flex;flex-direction:column;overflow:hidden;}
  body{overflow:hidden;}
  /* hero — identity band: name + labelled ledger meta, same vocabulary as the stat strip */
  .hero{background:linear-gradient(120deg,rgba(255,255,255,.05),transparent 45%),var(--bg-2);border:1px solid var(--line-2);border-radius:14px;padding:22px 26px;margin-bottom:14px;display:flex;gap:20px;align-items:center;text-align:left;flex-shrink:0;}
  .hero-badge{width:64px;height:64px;border-radius:14px;background:linear-gradient(135deg,#f4f6fb,#d4dae6);color:#15171c;display:grid;place-items:center;font-family:var(--fd);font-weight:900;font-size:24px;flex-shrink:0;}
  .hero-main{flex:1;min-width:0;}
  .hero-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .hero-name{font-family:var(--fd);font-size:25px;font-weight:800;color:#fff;letter-spacing:-.01em;line-height:1.1;}
  .sec-tag{font-family:var(--fd);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:4px 10px;border:1px solid var(--line-2);border-radius:5px;color:var(--text-2);}
  .hero-meta{display:flex;flex-wrap:wrap;margin-top:14px;}
  .hm{padding:0 28px;border-left:1px solid var(--line);min-width:0;}
  .hm:first-child{padding-left:0;border-left:none;}
  .hm-l{font-family:var(--fd);font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);}
  .hm-v{font-size:13.5px;color:var(--text);font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stars{color:var(--star);letter-spacing:1px;}.stars .off{color:var(--line-2);}
  .blk{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:5px;background:rgba(255,77,77,.18);color:var(--danger);font-family:var(--fd);}
  /* stat cards */
  .stats{display:flex;background:var(--bg-2);border:1px solid var(--line-2);border-radius:12px;margin-bottom:14px;flex-shrink:0;overflow:hidden;}
  .stat{flex:1;padding:13px 18px;display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--line);}
  .stat:first-child{border-left:none;}
  .stat .v{font-family:'Archivo',sans-serif;font-weight:800;}
  .stat .l{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);font-weight:700;}
  .stat .v{font-family:var(--fd);font-size:19px;font-weight:900;color:#fff;margin-top:2px;line-height:1.1;}
  .stat .v small{font-size:12px;color:var(--text-2);}
  .stat .s{font-size:10.5px;color:var(--text-3);margin-top:0;}
  /* layout — static page, only the tab body scrolls */
  .acct-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;padding:10px 18px;}
  @media(max-width:760px){.acct-grid{grid-template-columns:1fr;}}
  @media(max-width:980px){.stats{grid-template-columns:repeat(2,1fr);}}
  .card{background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;min-height:0;}
  .card-h{padding:12px 18px;border-bottom:2px solid var(--line-2);display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .card-h h3{font-family:var(--fd);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#aab2c4;}
  .card-h .count{font-family:var(--fm);font-size:11px;color:var(--text-2);background:var(--bg-4);padding:2px 8px;border-radius:20px;}
  .card-h .add{margin-left:auto;font-size:12px;padding:5px 11px;border-radius:6px;border:1px solid var(--line-2);background:var(--bg-3);color:var(--text-2);cursor:pointer;font-weight:600;font-family:inherit;}
  .card-h .add:hover{border-color:var(--brass);color:var(--brass-2);}
  /* the main tabbed panel fills the column; its body scrolls internally */
  .panel-main{flex:1;min-height:0;}
  .tab-body{flex:1;min-height:0;overflow-y:auto;}
  .tab-body::-webkit-scrollbar{width:8px;}.tab-body::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:5px;border:2px solid var(--bg-2);}
  /* detail tabs (Contacts / Inquiries / Sales Orders / Notes) */
  .htabs{display:flex;gap:4px;margin-left:auto;}
  .htab{font-size:11.5px;padding:9px 4px;margin:0 9px;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--text-3);cursor:pointer;font-weight:700;font-family:inherit;display:inline-flex;align-items:center;gap:6px;letter-spacing:.02em;text-transform:uppercase;font-size:10.5px;}
  .htab:hover{border-color:var(--brass);color:var(--text);}
  .htab.on{background:transparent!important;color:#fff!important;border:none!important;border-bottom:2px solid var(--brass-2)!important;border-radius:0!important;}
  .htab .tn{font-size:10px;padding:1px 7px;border-radius:10px;background:var(--bg-4);color:var(--text-2);}
  .htab.on .tn{background:var(--brass-bg);color:var(--brass);}
  .card-b{padding:6px 0;}
  /* contacts — listing (a row opens that contact's popup) */
  .ct-wrap{padding:10px 20px 18px;}
  .ct-scroll{max-height:264px;overflow-y:auto;border:1.5px solid var(--line);border-radius:10px;}
  .ct-scroll::-webkit-scrollbar{width:9px;}
  .ct-scroll::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:5px;border:2px solid var(--bg-2);}
  .ct-add{display:block;width:100%;margin-top:10px;padding:12px;border:1.5px dashed var(--line-2);border-radius:10px;background:transparent;color:var(--text-2);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;transition:.13s;}
  .ct-add:hover{border-color:#fff;color:#fff;}
  .ct-tbl{width:100%;border-collapse:collapse;}
  .ct-tbl thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#fff;font-weight:800;padding:13px 18px;background:var(--bg-3);border-bottom:2px solid var(--line-2);white-space:nowrap;position:sticky;top:0;z-index:2;}
  /* contact popup */
  #cm-ov{position:fixed;inset:0;background:rgba(8,10,14,.72);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:8500;padding:20px;}
  #cm-ov.open{display:flex;}
  #cm{background:var(--bg-2);border:2px solid var(--line-2);border-radius:14px;width:100%;max-width:520px;padding:22px 24px;max-height:92vh;overflow-y:auto;}
  #cm h3{font-family:var(--fd);font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#fff;margin-bottom:16px;}
  .cm-check{display:flex;gap:9px;align-items:center;font-size:13px;color:var(--text-2);margin-top:4px;cursor:pointer;}
  .cm-check input{width:15px;height:15px;accent-color:#f4f6fb;}
  #cm .foot{display:flex;gap:9px;margin-top:18px;align-items:center;justify-content:flex-end;}
  #cm .cm-del{margin-right:auto;border-color:rgba(255,77,77,.5);color:var(--danger);}
  #cm .cm-del:hover{background:var(--danger);color:#fff;border-color:var(--danger);}
  .ct-tbl tbody td{padding:18px;border-bottom:1.5px solid var(--line);vertical-align:top;font-size:13.5px;color:var(--text-2);}
  .ct-tbl tbody tr{cursor:pointer;transition:background .12s;}
  .ct-tbl tbody tr:hover{background:var(--bg-3);}
  .ct-tbl tbody tr:last-child td{border-bottom:none;}
  .ct-person{font-weight:700;color:#fff;white-space:nowrap;}
  .ct-desig{color:var(--text-2);}
  .ct-line{display:flex;align-items:center;gap:9px;padding:3px 0;}
  .ct-mono{font-family:var(--fm);color:var(--text-2);white-space:nowrap;}
  .ct-em{color:var(--text-2);text-decoration:none;}
  .ct-em:hover{text-decoration:underline;}
  .ct-tag{font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:1px 5px;border-radius:4px;border:1px solid var(--line-2);color:var(--text-3);}
  .c-prim{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:4px;background:var(--brass-2);color:#15171c;font-family:var(--fd);}
  .c-dash{color:var(--text-3);}
  /* history tables */
  table{width:100%;border-collapse:collapse;}
  thead th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);font-weight:700;padding:9px 18px;border-bottom:2px solid var(--line-2);background:var(--bg-3);}
  thead th.num{text-align:right;}
  tbody td{padding:11px 18px;border-bottom:1px solid var(--line);font-size:13px;}
  tbody tr{cursor:pointer;}tbody tr:hover{background:var(--bg-3);}
  tbody tr:last-child td{border-bottom:none;}
  .stage-id{font-family:var(--fm);font-size:12px;font-weight:700;color:#b9c1d2;}
  .money{font-family:var(--fm);font-weight:700;color:#fff;}.num{text-align:right;}
  .mini-st{font-size:10px;font-weight:800;text-transform:uppercase;padding:3px 8px;border-radius:5px;font-family:var(--fd);}
  .ms-send_art{background:var(--art);color:#1a0f08;}.ms-approval_due{background:var(--due);color:#231803;}
  .ms-approved{background:var(--approved);color:#04130a;}.ms-in_process{background:var(--process);color:#03101f;}.ms-invoice{background:var(--invoice);color:#15071f;}
  .pay-unpaid{background:var(--art);color:#1a0f08;}.pay-partial{background:var(--due);color:#231803;}.pay-paid{background:var(--approved);color:#04130a;}
  /* sidebar info */
  .info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .info-row:last-child{border-bottom:none;}
  .info-row .l{color:var(--text-3);}.info-row .v{font-weight:600;text-align:right;}
  .info-row .v.mono{font-family:var(--fm);}
  .notes-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);font-weight:700;margin-bottom:7px;}
  .notes{font-size:13px;color:var(--text-2);white-space:pre-wrap;line-height:1.5;}
  .notes.internal{color:var(--text-2);background:rgba(202,167,93,.07);border:1px solid rgba(202,167,93,.2);border-radius:8px;padding:11px;}
  .state{padding:30px 18px;text-align:center;color:var(--text-3);font-size:13px;}
  /* drawer (edit) */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s;z-index:50;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:50%;left:50%;width:min(780px,94vw);max-height:88vh;background:var(--bg-2);border:1px solid var(--line-2);border-radius:16px;box-shadow:0 32px 80px -24px rgba(0,0,0,.9);transform:translate(-50%,-50%) scale(.97);opacity:0;pointer-events:none;transition:.18s;z-index:60;display:flex;flex-direction:column;overflow:hidden;}
  .drawer.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto;}
  .ew-tabs{display:flex;gap:2px;padding:0 22px;border-bottom:1px solid var(--line-2);background:var(--bg-3);}
  .ewt{font-family:'Archivo',sans-serif;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:12px 4px;margin-right:18px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text-3);cursor:pointer;}
  .ewt.on{color:#fff;border-bottom-color:var(--brass-2);}
  .esec{display:none;}
  .esec.on{display:block;}
  .frow-2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
  .drawer-head{padding:18px 22px;border-bottom:2px solid var(--line-2);display:flex;align-items:center;}
  .drawer-head h3{font-family:var(--fd);font-size:16px;font-weight:800;text-transform:uppercase;}
  .drawer-head .x{margin-left:auto;background:var(--bg-4);border:none;color:var(--text-2);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;}
  .drawer-body{padding:22px;overflow-y:auto;flex:1;}
  .drawer-foot{padding:14px 22px;border-top:2px solid var(--line-2);display:flex;gap:10px;justify-content:flex-end;}
  .fgroup{margin-bottom:20px;}.fgroup-t{font-family:var(--fd);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--brass-2);margin-bottom:11px;padding-bottom:7px;border-bottom:1px solid var(--line);}
  .frow{display:flex;gap:12px;margin-bottom:12px;}.frow .field{flex:1;}.field{margin-bottom:12px;}
  label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);font-weight:700;margin-bottom:5px;}
  input.in,select.in,textarea.in{width:100%;border:1px solid var(--line-2);background:var(--bg);border-radius:var(--radius-sm);padding:9px 11px;font-size:13.5px;font-family:inherit;color:var(--text);}
  input.in:focus,select.in:focus,textarea.in:focus{outline:none;border-color:var(--brass);}textarea.in{resize:vertical;min-height:60px;}
  .contact-card{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;}
  .add-contact{width:100%;padding:9px;border:1px dashed var(--line-2);background:transparent;border-radius:var(--radius-sm);color:var(--text-3);font-weight:700;cursor:pointer;font-family:inherit;font-size:13px;}
  .add-contact:hover{border-color:var(--brass);color:var(--brass-2);}
  .msg{margin-right:auto;font-size:13px;color:var(--text-3);align-self:center;}.msg.ok{color:var(--approved);}.msg.err{color:var(--danger);}
  .btn-del-c{margin-left:auto;padding:5px 11px;font-size:12px;}
  /* sectors */
  .sec-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--fd,'Archivo');font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:rgba(139,147,165,.14);color:#aab2c0;vertical-align:2px;}
  .sec-chip::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;}
  .sec-chip.hot{background:rgba(242,179,77,.14);color:#f2b34d;}
  .sec-chip.now{background:rgba(62,207,142,.13);color:#3ecf8e;}
  .sec-box{position:relative;}
  .sec-menu{position:absolute;top:calc(100% + 3px);left:0;right:0;background:var(--bg-2,#16181d);border:1px solid var(--line-2,#414a5c);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:80;max-height:210px;overflow-y:auto;display:none;}
  .sec-menu.open{display:block;}
  .sec-opt{padding:9px 12px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;}
  .sec-opt:hover{background:var(--bg-3,#1f2229);}
  .sec-opt .mo{font-size:11px;color:var(--text-3,#9098a8);white-space:nowrap;}
  .sec-opt.new{color:var(--brass-2,#f4f6fb);font-weight:600;}
  .sec-months{display:none;gap:10px;margin-top:9px;}
  .sec-months.open{display:flex;}
  .sec-months .field{flex:1;}
  .sec-hint{font-size:11px;color:var(--text-3,#9098a8);margin:5px 0 0;}
  .busy-hint{margin:6px 0 16px;}
  /* fixed column plan so the listing reads deliberately at any width */
  .ct-tbl th:nth-child(1){width:27%;}
  .ct-tbl th:nth-child(2){width:22%;}
  .ct-tbl th:nth-child(3){width:23%;}
  .ct-tbl th:nth-child(4){width:28%;}

  /* ── embedded (opened as an overlay window from the dashboard) ──
     The window hugs the content: no forced full-viewport fill. */
  html.embedded body{overflow:visible;background:var(--bg-2);}
  html.embedded .topbar{position:static;background:var(--bg-2);}
  html.embedded .back{display:none;}
  html.embedded .wrap{height:auto;overflow:visible;max-width:none;padding:16px 20px 20px;}
  html.embedded .panel-main{flex:none;}
  html.embedded .tab-body{flex:none;max-height:400px;}
</style>

<body>
<header class="topbar">
  <a class="back" href="clients.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Clients</a>
  <div class="title" id="t-title">Client</div>
  <div class="actions"><button class="btn" id="btn-new-order">+ New Order</button><button class="btn-brass btn" id="btn-edit-co">Edit Company</button></div>
</header>
<div class="wrap" id="wrap"><div class="state">Loading client…</div></div>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head"><h3>Edit Company</h3><button class="x" id="d-close">×</button></div>
  <div class="drawer-body" id="d-body"></div>
  <div class="drawer-foot"><span class="msg" id="d-msg"></span><button class="btn" id="d-cancel">Cancel</button><button class="btn-brass btn" id="d-save">Save</button></div>
</aside>

<script type="module">
import { supabase as db, requireAuth, signOut, currentUser, todayLocal } from './auth.js';
import { openWindow } from './overlay.js';
await requireAuth();

// ── Overlay-window mode (opened from the clients dashboard) ──
// Detection is by framing, like order.html: the window hugs the content.
const EMBED = window.self !== window.top;
function embedPost(m){ try{ parent.postMessage(m,'*'); }catch(e){} }
// Esc works no matter where focus is (typing in a field inside this page):
// peel the innermost layer — contact popup, company drawer, then the window.
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  const cm=document.getElementById('cm-ov');
  const dr=document.getElementById('drawer');
  if(cm&&cm.classList.contains('open'))closeCM();
  else if(dr&&dr.classList.contains('open'))closeD();
  else if(EMBED)embedPost({yrt:'close',refresh:true});
});
if (EMBED) {
  document.documentElement.classList.add('embedded');
  const report = () => { try{ parent.postMessage({yrt:'height', h: document.body.scrollHeight + 2}, '*'); }catch(e){} };
  new ResizeObserver(report).observe(document.body);
  window.addEventListener('load', report);
  window.addEventListener('message', e => {
    const d = e.data || {};
    if (d.yrt === 'requestClose') {
      // Esc / backdrop: innermost layer first — contact popup, then the
      // company drawer, then the window itself.
      const cm = document.getElementById('cm-ov');
      const dr = document.getElementById('drawer');
      if (cm && cm.classList.contains('open')) closeCM();
      else if (dr && dr.classList.contains('open')) closeD();
      else embedPost({yrt:'close', refresh:true});
    }
  });
}

// ---- shared styled modal (replaces native alert/confirm) ----
function __ensureModal(){
  if(document.getElementById('__sm_ov'))return;
  const css=document.createElement('style');

  document.head.appendChild(css);

const __SM_IC={warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',danger:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'};
function smAlert(msg,title,type){return new Promise(res=>{__ensureModal();type=type||'info';document.getElementById('__sm_ic').className='ic '+type;document.getElementById('__sm_ic').innerHTML=__SM_IC[type]||__SM_IC.info;document.getElementById('__sm_t').textContent=title||'Notice';document.getElementById('__sm_m').textContent=msg||'';const f=document.getElementById('__sm_f');f.innerHTML='<button class="b primary" id="__sm_ok">Got it</button>';const ov=document.getElementById('__sm_ov');const close=()=>{ov.classList.remove('open');res(true);};f.querySelector('#__sm_ok').onclick=close;ov.onclick=e=>{if(e.target===ov)close();};ov.classList.add('open');});}
function smConfirm(msg,title,opts){opts=opts||{};return new Promise(res=>{__ensureModal();const type=opts.type||'warn';document.getElementById('__sm_ic').className='ic '+type;document.getElementById('__sm_ic').innerHTML=__SM_IC[type]||__SM_IC.warn;document.getElementById('__sm_t').textContent=title||'Confirm';document.getElementById('__sm_m').textContent=msg||'';const f=document.getElementById('__sm_f');f.innerHTML='<button class="b plain" id="__sm_no">'+(opts.cancelText||'Cancel')+'</button><button class="b '+(opts.danger?'danger':'primary')+'" id="__sm_yes">'+(opts.confirmText||'Confirm')+'</button>';const ov=document.getElementById('__sm_ov');const close=v=>{ov.classList.remove('open');res(v);};f.querySelector('#__sm_yes').onclick=()=>close(true);f.querySelector('#__sm_no').onclick=()=>close(false);ov.onclick=e=>{if(e.target===ov)close(false);};ov.classList.add('open');});}

const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD=d=>{if(!d)return '—';const x=new Date(d+'T00:00:00');return x.getDate()+' '+MON[x.getMonth()]+' '+x.getFullYear();};
const money=n=>'$'+Number(n||0).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>{const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;};
const PROV=['Ontario','Alberta','British Columbia','Manitoba','New Brunswick','Newfoundland and Labrador','Nova Scotia','Prince Edward Island','Quebec','Saskatchewan'];
const ST_LABEL={send_art:'Send Art',approval_due:'Approval',approved:'Approved',in_process:'Process',invoice:'Invoice',no_data:'—'};
const CID=new URLSearchParams(location.search).get('id');
let ACCT={};
let CLIENT=null,CONTACTS=[],ORDERS=[],INVOICES=[];
let SECTORS=[],SECMAP={},SEC_OK=false;
// BUSY_OK: the clients table has the per-client busy-period columns (busy_from/busy_to)
let BUSY_OK=false;
// Sector is a plain industry label now — no season colour states.
function secChipFor(sectorId){
  const s=SEC_OK&&SECMAP[sectorId]; if(!s)return '';
  return `<span class="sec-tag">${esc(s.name)}</span>`;
}
let INQ=[],QUOTE=[],SALES=[],HTAB='inquiry';

function stars(n){n=n||0;let s='';for(let i=1;i<=5;i++)s+=`<span class="${i<=n?'':'off'}">★</span>`;return `<span class="stars">${s}</span>`;}
function initials(name){return (name||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();}

async function load(){
  if(!CID){document.getElementById('wrap').innerHTML='<div class="state">No client specified.</div>';return;}
  const {data,error}=await db.from('clients').select('*, contacts(*)').eq('id',CID).single();
  if(error||!data){document.getElementById('wrap').innerHTML=`<div class="state">Couldn't load client. ${error?.message||''}</div>`;return;}
  CLIENT=data;CONTACTS=(data.contacts||[]).sort((a,b)=>(b.is_primary?1:0)-(a.is_primary?1:0));
  BUSY_OK=('busy_from' in data);   // lights up once the busy-period migration has run
  // orders + quotes for this client
  const {data:ord}=await db.from('quotes').select('*').eq('client_id',CID).order('quote_date',{ascending:false});
  ORDERS=ord||[];
  const {data:inv}=await db.from('invoices').select('*').eq('client_id',CID).order('invoice_date',{ascending:false});
  INVOICES=inv||[];
  const {data:secs,error:secErr}=await db.from('sectors').select('*').order('name');
  SEC_OK=!secErr; SECTORS=secs||[]; SECMAP={}; SECTORS.forEach(s=>SECMAP[s.id]=s);
  render();
}

function render(){
  document.getElementById('t-title').textContent=CLIENT.company_name;
  // split history by record type
  INQ=ORDERS.filter(o=>o.record_type==='inquiry');
  QUOTE=ORDERS.filter(o=>o.record_type==='quote');
  SALES=ORDERS.filter(o=>o.record_type==='order');
  // compute stats
  const realOrders=SALES;
  const totalSpend=INVOICES.reduce((s,i)=>s+Number(i.grand_total||0),0);
  const balance=INVOICES.reduce((s,i)=>s+Number(i.balance_due||0),0);
  const orderVals=realOrders.map(o=>Number(o.grand_total||0)).filter(v=>v>0);
  const avgOrder=orderVals.length?orderVals.reduce((a,b)=>a+b,0)/orderVals.length:0;
  const maxOrder=orderVals.length?Math.max(...orderVals):0;
  const dates=ORDERS.map(o=>o.quote_date).filter(Boolean).sort();
  const firstDate=CLIENT.client_since||dates[0];
  const lastDate=CLIENT.last_transaction||dates[dates.length-1];
  const loc=[CLIENT.bill_unit,CLIENT.bill_address,CLIENT.bill_city,CLIENT.bill_province,CLIENT.bill_postal].filter(Boolean).join(', ');

  document.getElementById('wrap').innerHTML=`
    <div class="hero">
      <div class="hero-badge">${esc(initials(CLIENT.company_name))}</div>
      <div class="hero-main">
        <div class="hero-top">
          <span class="hero-name">${esc(CLIENT.company_name)}</span>
          ${secChipFor(CLIENT.sector_id)}
          ${CLIENT.blacklisted?'<span class="blk">Blacklisted</span>':''}
        </div>
        <div class="hero-meta">
          ${loc?`<div class="hm"><div class="hm-l">Address</div><div class="hm-v">${esc(loc)}</div></div>`:''}
          ${CLIENT.serviced_by?`<div class="hm"><div class="hm-l">Serviced by</div><div class="hm-v">${esc(CLIENT.serviced_by)}</div></div>`:''}
          <div class="hm"><div class="hm-l">Terms</div><div class="hm-v">${CLIENT.terms_days?CLIENT.terms_days+' day terms':'Prepaid'}</div></div>
          <div class="hm"><div class="hm-l">Rating</div><div class="hm-v">${stars(CLIENT.rating)}</div></div>
        </div>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="l">Total Orders</div><div class="v">${realOrders.length}</div><div class="s">all-time</div></div>
      <div class="stat"><div class="l">Total Spend</div><div class="v"><small>$</small>${Math.round(totalSpend).toLocaleString('en-CA')}</div><div class="s">invoiced</div></div>
      <div class="stat"><div class="l">Balance Due</div><div class="v" style="color:${balance>0?'var(--art)':'var(--approved)'}"><small>$</small>${Math.round(balance).toLocaleString('en-CA')}</div><div class="s">${balance>0?'owing':'clear'}</div></div>
      <div class="stat"><div class="l">Avg Order</div><div class="v"><small>$</small>${Math.round(avgOrder).toLocaleString('en-CA')}</div><div class="s">max ${money(maxOrder)}</div></div>
      <div class="stat"><div class="l">Contacts</div><div class="v">${CONTACTS.length}</div><div class="s">people</div></div>
    </div>

    <div class="card panel-main">
      <div class="card-h">
        <div class="htabs" id="htabs" style="margin-left:0;">
          <button class="htab on" data-tab="contacts">Contacts <span class="tn">${CONTACTS.length}</span></button>
          <button class="htab" data-tab="inquiry">Inquiries <span class="tn">${INQ.length}</span></button>
          <button class="htab" data-tab="quote">Quotations <span class="tn">${QUOTE.length}</span></button>
          <button class="htab" data-tab="order">Sales Orders <span class="tn">${SALES.length}</span></button>
          <button class="htab" data-tab="invoice">Invoices <span class="tn">${INVOICES.length}</span></button>
          <button class="htab" data-tab="notes">Notes</button>
          <button class="htab" data-tab="account">Account</button>
        </div>
      </div>
      <div id="htab-body" class="tab-body"></div>
    </div>`;
  ACCT={firstDate,lastDate};

  // detail tabs — default to Contacts
  HTAB='contacts';
  document.querySelectorAll('#htabs .htab').forEach(t=>t.addEventListener('click',()=>{
    HTAB=t.dataset.tab;
    document.querySelectorAll('#htabs .htab').forEach(x=>x.classList.toggle('on',x.dataset.tab===HTAB));
    renderHistoryTab();
  }));
  renderHistoryTab();
}

function renderHistoryTab(){
  const body=document.getElementById('htab-body');if(!body)return;
  const orderRows=list=>list.length?`<table><thead><tr><th>ID</th><th>Subject</th><th>Date</th><th>Stage</th><th class="num">Total</th></tr></thead><tbody>${list.map(o=>`
    <tr data-order="${o.id}"><td><span class="stage-id">#${o.stage_id}</span></td><td>${esc(o.subject||'—')}</td><td>${fmtD(o.quote_date)}</td><td><span class="mini-st ms-${o.art_status}">${ST_LABEL[o.art_status]||o.art_status}</span></td><td class="num"><span class="money">${money(o.grand_total)}</span></td></tr>`).join('')}</tbody></table>`:null;
  if(HTAB==='contacts'){
    // multi-value cell: each phone/email on its own line, tagged primary/alt when 2+
    const multi=arr=>arr.length?arr.map((h,i)=>`<div class="ct-line">${h}${arr.length>1?`<span class="ct-tag">${i===0?'primary':'alt'}</span>`:''}</div>`).join(''):'<span class="c-dash">—</span>';
    const rowsHtml=CONTACTS.map((c,i)=>{
      const nm=((c.first_name||'')+' '+(c.last_name||'')).trim()||'—';
      const phones=[c.tel1,c.tel2].filter(Boolean).map(t=>`<span class="ct-mono">${esc(t)}</span>`);
      const emails=[c.email1,c.email2].filter(Boolean).map(e=>`<a class="ct-em" href="mailto:${esc(e)}">${esc(e)}</a>`);
      return `<tr class="ct-row" data-ci="${i}">
        <td class="ct-person">${esc(nm)} ${c.is_primary?'<span class="c-prim">Primary</span>':''}</td>
        <td class="ct-desig">${esc(c.designation||'')||'<span class="c-dash">—</span>'}</td>
        <td>${multi(phones)}</td>
        <td>${multi(emails)}</td>
      </tr>`;}).join('');
    // the box shows at most ~3 contacts; beyond that it gets its own scrollbar
    body.innerHTML=`<div class="ct-wrap">
      ${CONTACTS.length?`<div class="ct-scroll"><table class="ct-tbl"><thead><tr><th>Contact Person</th><th>Designation</th><th>Telephone</th><th>Email</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>`
        :`<div class="state" style="padding:24px;">No contacts yet — add the first one below.</div>`}
      <button class="ct-add" id="ct-add-btn">+ Add contact</button>
    </div>`;
    // a row opens ONLY that person's info in the contact popup
    body.querySelectorAll('.ct-row').forEach(tr=>tr.addEventListener('click',e=>{if(e.target.closest('a'))return;openContactModal(CONTACTS[+tr.dataset.ci]);}));
    document.getElementById('ct-add-btn').addEventListener('click',()=>openContactModal(null));
  }
  else if(HTAB==='notes'){
    const gen=CLIENT.notes?`<div class="card-b" style="padding:16px 18px;"><div class="notes-h">General Notes</div><div class="notes">${esc(CLIENT.notes)}</div></div>`:'';
    const intl=CLIENT.internal_notes?`<div class="card-b" style="padding:16px 18px;"><div class="notes-h">Internal Notes</div><div class="notes internal">${esc(CLIENT.internal_notes)}</div></div>`:'';
    body.innerHTML=(gen||intl)?(gen+intl):'<div class="state">No notes for this client. Click “Edit Company” to add notes.</div>';
  }
  else if(HTAB==='account'){
    const row=(l,v)=>`<div class="info-row"><span class="l">${l}</span><span class="v">${v}</span></div>`;
    body.innerHTML=`<div class="acct-grid">
      <div>
        ${row('Client Since',fmtD(ACCT.firstDate))}
        ${row('Last Transaction',fmtD(ACCT.lastDate))}
        ${row('Payment Terms',CLIENT.terms_days?CLIENT.terms_days+' days':'Prepaid')}
        ${row('Shipment',{pickup:'Pick-up',courier:'Courier',deliver:'Deliver'}[CLIENT.shipment_mode]||'—')}
        ${row('Rating',stars(CLIENT.rating))}
      </div>
      <div>
        ${row('Sector',SEC_OK&&SECMAP[CLIENT.sector_id]?esc(SECMAP[CLIENT.sector_id].name):'—')}
        ${row('Busy Period',(BUSY_OK&&CLIENT.busy_from&&CLIENT.busy_to)?(fmtD(CLIENT.busy_from)+' – '+fmtD(CLIENT.busy_to)+' · repeats yearly'):'—')}
        ${row('Contact Cycle',CLIENT.contact_cycle_months?CLIENT.contact_cycle_months+' days':'—')}
        ${row('Referred By',esc(CLIENT.referred_by||'—'))}
      </div>
    </div>`;
  }
  else if(HTAB==='inquiry'){body.innerHTML=orderRows(INQ)||'<div class="state">No inquiries for this client.</div>';}
  else if(HTAB==='quote'){body.innerHTML=orderRows(QUOTE)||'<div class="state">No quotations for this client.</div>';}
  else if(HTAB==='order'){body.innerHTML=orderRows(SALES)||'<div class="state">No sales orders for this client.</div>';}
  else if(HTAB==='invoice'){
    body.innerHTML=INVOICES.length?`<table><thead><tr><th>Invoice</th><th>Date</th><th class="num">Total</th><th class="num">Balance</th><th>Status</th></tr></thead><tbody>${INVOICES.map(i=>`
      <tr data-inv="${i.id}"><td><span class="stage-id">#${i.invoice_number||'—'}</span></td><td>${fmtD(i.invoice_date)}</td><td class="num"><span class="money">${money(i.grand_total)}</span></td><td class="num" style="color:${i.balance_due>0?'var(--art)':'var(--approved)'};font-family:var(--fm);font-weight:700;">${money(i.balance_due)}</td><td><span class="mini-st pay-${i.paid_status}">${i.paid_status}</span></td></tr>`).join('')}</tbody></table>`:'<div class="state">No invoices for this client.</div>';
  }
  // Embedded: the record swaps into this same window (order.html is an allowed
  // frame page); invoices are full pages, so hand navigation to the top window.
  body.querySelectorAll('tr[data-order]').forEach(tr=>tr.addEventListener('click',()=>{
    const href='order.html?id='+encodeURIComponent(tr.dataset.order);
    if(EMBED) location.href=href; else openWindow(href,{onClose:load});
  }));
  body.querySelectorAll('tr[data-inv]').forEach(tr=>tr.addEventListener('click',()=>{
    const href='invoice.html?id='+encodeURIComponent(tr.dataset.inv);
    if(EMBED) embedPost({yrt:'navigate',href}); else location.href=href;
  }));
}

    </div>
    </div>`;
  document.querySelectorAll('#ew-tabs .ewt').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('#ew-tabs .ewt').forEach(x=>x.classList.toggle('on',x===t));
    document.querySelectorAll('.esec').forEach(sec=>sec.classList.toggle('on',sec.dataset.esec===t.dataset.s));
  }));
  if(SEC_OK)wireSector(c.sector_id);
  // Contact Cycle Duration: preset dropdown, with a custom 1–365 input on demand
  const _cs=document.getElementById('cycle_sel'),_cc=document.getElementById('cycle_custom');
  _cs.addEventListener('change',()=>{
    const custom=_cs.value==='custom';
    _cc.style.display=custom?'':'none';
    if(custom)_cc.focus();
  });
}

// ── Sector type-ahead (same rules as the client list: match existing, or create with a busy season)
let SEC_SEL=null;
function wireSector(currentId){
  const inp=document.getElementById('sector-input'),menu=document.getElementById('sec-menu');
  const hint=document.getElementById('sec-hint');
  SEC_SEL=currentId||null;
  const sync=()=>{
    const q=inp.value.trim().toLowerCase();
    const exact=SECTORS.find(s=>s.name.toLowerCase()===q);
    SEC_SEL=exact?exact.id:null;
    hint.textContent=(q&&!exact)?'New sector — it will be created when you save.':'';
    if(!q){menu.classList.remove('open');return;}
    const hits=SECTORS.filter(s=>s.name.toLowerCase().includes(q)).slice(0,8);
    menu.innerHTML=hits.map(s=>`<div class="sec-opt" data-id="${s.id}"><span>${esc(s.name)}</span></div>`).join('')
      +(exact?'':`<div class="sec-opt new" data-new="1">Create “${esc(inp.value.trim())}”</div>`);
    menu.classList.add('open');
    menu.querySelectorAll('.sec-opt').forEach(o=>o.addEventListener('mousedown',e=>{
      e.preventDefault();
      if(o.dataset.id){const s=SECMAP[o.dataset.id];inp.value=s.name;SEC_SEL=s.id;hint.textContent='';}
      menu.classList.remove('open');
    }));
  };
  inp.addEventListener('input',sync);
  inp.addEventListener('focus',sync);
  inp.addEventListener('blur',()=>setTimeout(()=>menu.classList.remove('open'),150));
}
async function resolveSector(){
  if(!SEC_OK)return undefined;
  const inp=document.getElementById('sector-input');
  if(!inp)return undefined;
  const name=inp.value.trim();
  if(!name)return null;
  const exact=SECTORS.find(s=>s.name.toLowerCase()===name.toLowerCase());
  if(exact)return exact.id;
  const payload={name,active_from_month:1,active_to_month:12};   // sector is a plain label; months are legacy columns
  const {data,error}=await db.from('sectors').insert(payload).select().single();
  if(error)throw new Error('Sector: '+error.message);
  SECTORS.push(data);SECMAP[data.id]=data;
  return data.id;
}
// ── Contact popup ───────────────────────────────────────────────────
// Contacts are managed one at a time through this popup (like adding a
// line item on an order): "+ Add contact" opens it blank, clicking a
// listing row opens it with that person loaded. Writes go straight to
// the contacts table; the company drawer never touches contacts.
let CM_EDIT=null;   // the contact being edited, or null for a new one
function ensureContactModal(){
  if(document.getElementById('cm-ov'))return;
  const ov=document.createElement('div');ov.id='cm-ov';
  ov.innerHTML=`<div id="cm">
    <h3 id="cm-title">Add Contact</h3>
    <div class="frow"><div class="field"><label>First Name</label><input class="in" id="cm-first"></div>
      <div class="field"><label>Last Name</label><input class="in" id="cm-last"></div></div>
    <div class="field"><label>Designation</label><input class="in" id="cm-desig" placeholder="e.g. Procurement Lead"></div>
    <div class="frow"><div class="field"><label>Phone · primary</label><input class="in" id="cm-tel1" placeholder="905-555-0100"></div>
      <div class="field"><label>Phone · alternate</label><input class="in" id="cm-tel2" placeholder="optional"></div></div>
    <div class="frow"><div class="field"><label>Email · primary</label><input class="in" id="cm-email1" placeholder="name@company.com"></div>
      <div class="field"><label>Email · alternate</label><input class="in" id="cm-email2" placeholder="optional"></div></div>
    <label class="cm-check"><input type="checkbox" id="cm-primary"> Primary contact for this client</label>
    <div class="msg" id="cm-msg"></div>
    <div class="foot">
      <button class="btn cm-del" id="cm-del">Remove</button>
      <button class="btn" id="cm-cancel">Cancel</button>
      <button class="btn btn-brass" id="cm-save">Save Contact</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov)closeCM();});
  document.getElementById('cm-cancel').addEventListener('click',closeCM);
  document.getElementById('cm-save').addEventListener('click',saveContact);
  document.getElementById('cm-del').addEventListener('click',deleteContact);
}
function openContactModal(ct){
  ensureContactModal();
  CM_EDIT=ct||null;
  document.getElementById('cm-title').textContent=ct?'Edit Contact':'Add Contact';
  const set=(id,v)=>{document.getElementById(id).value=v||'';};
  set('cm-first',ct?.first_name);set('cm-last',ct?.last_name);set('cm-desig',ct?.designation);
  set('cm-tel1',ct?.tel1);set('cm-tel2',ct?.tel2);set('cm-email1',ct?.email1);set('cm-email2',ct?.email2);
  document.getElementById('cm-primary').checked=ct?!!ct.is_primary:CONTACTS.length===0;
  document.getElementById('cm-primary').disabled=!ct&&CONTACTS.length===0;   // first contact is always primary
  document.getElementById('cm-del').style.display=ct?'':'none';
  document.getElementById('cm-msg').textContent='';document.getElementById('cm-msg').className='msg';
  document.getElementById('cm-ov').classList.add('open');
  document.getElementById('cm-first').focus();
}
function closeCM(){const ov=document.getElementById('cm-ov');if(ov)ov.classList.remove('open');CM_EDIT=null;}
async function saveContact(){
  const msg=document.getElementById('cm-msg');
  const v=id=>document.getElementById(id).value.trim();
  const rec={first_name:v('cm-first')||null,last_name:v('cm-last')||null,designation:v('cm-desig')||null,
    tel1:v('cm-tel1')||null,tel2:v('cm-tel2')||null,email1:v('cm-email1')||null,email2:v('cm-email2')||null};
  if(!(rec.first_name||rec.last_name||rec.tel1||rec.email1)){msg.textContent='Give the contact at least a name, phone, or email.';msg.className='msg err';return;}
  const prim=document.getElementById('cm-primary').checked||CONTACTS.length===0;
  rec.is_primary=prim;
  msg.textContent='Saving…';msg.className='msg';
  let savedId=CM_EDIT?.id||null, err=null;
  if(CM_EDIT){ ({error:err}=await db.from('contacts').update(rec).eq('id',CM_EDIT.id)); }
  else { const {data,error}=await db.from('contacts').insert({...rec,client_id:CID}).select().single(); err=error; savedId=data?.id; }
  if(err){msg.textContent='Error: '+err.message;msg.className='msg err';return;}
  if(prim&&savedId) await db.from('contacts').update({is_primary:false}).eq('client_id',CID).neq('id',savedId);
  await ensureOnePrimary();
  closeCM();await load();
}
async function deleteContact(){
  if(!CM_EDIT)return;
  const nm=((CM_EDIT.first_name||'')+' '+(CM_EDIT.last_name||'')).trim()||'this contact';
  const ok=await smConfirm('Remove '+nm+' from this client? This cannot be undone.','Remove contact',{danger:true,confirmText:'Remove'});
  if(!ok)return;
  const {error}=await db.from('contacts').delete().eq('id',CM_EDIT.id);
  if(error){const msg=document.getElementById('cm-msg');msg.textContent='Error: '+error.message;msg.className='msg err';return;}
  await ensureOnePrimary();
  closeCM();await load();
}
// Belt and braces: a client with contacts always has exactly one primary.
async function ensureOnePrimary(){
  const {data}=await db.from('contacts').select('id,is_primary').eq('client_id',CID);
  const list=data||[];
  if(list.length&&!list.some(c=>c.is_primary)) await db.from('contacts').update({is_primary:true}).eq('id',list[0].id);
}
async function save(){
  const msg=document.getElementById('d-msg');const name=document.getElementById('company_name').value.trim();
  if(!name){msg.textContent='Company name required';msg.className='msg err';return;}
  msg.textContent='Saving…';msg.className='msg';
  let _sector; try{_sector=await resolveSector();}catch(e){msg.textContent=e.message;msg.className='msg err';return;}
  // Contact Cycle Duration: preset value, or the custom input (both capped 1–365)
  const _sel=document.getElementById('cycle_sel').value;
  const _cyc=_sel==='custom'?(+document.getElementById('cycle_custom').value||0):(+_sel||0);
  const payload={company_name:name,rating:+document.getElementById('rating').value||null,terms_days:+document.getElementById('terms_days').value||0,
    serviced_by:document.getElementById('serviced_by').value||null,shipment_mode:document.getElementById('shipment_mode').value,
    contact_cycle_months:_cyc?Math.min(365,Math.max(1,_cyc)):null,referred_by:document.getElementById('referred_by').value||null,
    client_since:document.getElementById('client_since').value||null,blacklisted:document.getElementById('blacklisted').value==='true',
    bill_unit:document.getElementById('bill_unit').value||null,bill_address:document.getElementById('bill_address').value||null,
    bill_city:document.getElementById('bill_city').value||null,bill_postal:document.getElementById('bill_postal').value||null,
    bill_province:document.getElementById('bill_province').value||null,notes:document.getElementById('notes').value||null,internal_notes:document.getElementById('internal_notes').value||null};
  if(_sector!==undefined)payload.sector_id=_sector;
  if(BUSY_OK){payload.busy_from=document.getElementById('busy_from').value||null;payload.busy_to=document.getElementById('busy_to').value||null;}
  const {error}=await db.from('clients').update(payload).eq('id',CID);
  if(error){msg.textContent='Error: '+error.message;msg.className='msg err';return;}
  msg.textContent='Saved ✓';msg.className='msg ok';await load();setTimeout(closeD,500);
}
document.getElementById('btn-edit-co').addEventListener('click',()=>{editForm();openD();});
document.getElementById('d-close').addEventListener('click',closeD);
document.getElementById('d-cancel').addEventListener('click',closeD);
document.getElementById('overlay').addEventListener('click',closeD);
document.getElementById('d-save').addEventListener('click',save);
document.getElementById('btn-new-order').addEventListener('click',async()=>{
  const {data,error}=await db.from('quotes').insert({record_type:'order',art_status:'send_art',sent_status:'not_sent',active_status:'active',quote_date:todayLocal(),subject:'New order',client_id:CID}).select().single();
  if(error){await smAlert('Could not create order: '+error.message,'Error','danger');return;}
  const href='order.html?id='+encodeURIComponent(data.id);
  if(EMBED) location.href=href; else openWindow(href,{onClose:load});
});
load();
</script>
