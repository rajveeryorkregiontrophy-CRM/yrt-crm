<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clients — YRT CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1115;--bg-2:#16181d;--bg-3:#1f2229;--bg-4:#2a2e37;--sidebar:#0a0c0f;
    --line:#323a48;--line-2:#414a5c;--text:#eef0f4;--text-2:#aeb4c0;--text-3:#767d8c;
    --brass:#e7ebf3;--brass-2:#f4f6fb;--brass-bg:rgba(231,235,243,.10);
    --approved:#3ddc84;--danger:#ff4d4d;--star:#ffb627;
    --radius:11px;--radius-sm:8px;
    --fd:'Archivo',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif;--fm:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:var(--fb);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  ::-webkit-scrollbar{width:10px;height:10px;}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px;border:2px solid var(--bg);}
  .brand{padding:22px 20px 18px;border-bottom:1px solid var(--line);}
  .brand .mark{font-family:var(--fd);font-weight:900;font-size:17px;color:#fff;line-height:1.12;text-transform:uppercase;}
  .brand .mark .amp{color:var(--brass-2);}
  .nav{padding:14px 12px;flex:1;overflow-y:auto;}
  .nav a{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:var(--radius-sm);color:var(--text-2);text-decoration:none;font-weight:500;font-size:13.5px;margin-bottom:2px;transition:.13s;}
  .nav a:hover{background:var(--bg-3);color:#fff;}
  .nav a.active{background:linear-gradient(90deg,#f4f6fb,#cfd6e3);color:#15171c;font-weight:700;}
  .nav a .ico{width:17px;height:17px;flex-shrink:0;}
  .nav a .badge{margin-left:auto;background:transparent;color:var(--text-3);font-size:11px;font-weight:800;padding:0;font-family:var(--fd);}
  .nav a.active .badge{background:rgba(0,0,0,.25);color:#15171c;}
  .nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;color:#aab0c0;padding:20px 10px 8px;font-weight:700;}
  .nav-sep{height:1px;background:var(--line);margin:14px 14px;opacity:.7;}
  .nav-label:first-child{padding-top:8px;}
  .sidebar-foot{padding:13px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;}
  .logout-btn{margin-left:auto;background:var(--bg-3);border:1px solid var(--line-2);color:var(--text-3);width:32px;height:32px;border-radius:8px;cursor:pointer;display:grid;place-items:center;transition:.13s;}
  .logout-btn:hover{border-color:var(--danger);color:var(--danger);}
  .logout-btn svg{width:16px;height:16px;}
  .avatar{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#f4f6fb,#d4dae6);color:#15171c;display:grid;place-items:center;font-weight:900;font-size:10px;}

  .main{display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden;}
  .topbar{height:62px;background:var(--bg-2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 26px;flex-shrink:0;z-index:20;}
  .topbar h1{font-family:var(--fd);font-size:20px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;}
  .search{margin-left:auto;position:relative;width:280px;}
  .search input{width:100%;border:1px solid var(--line-2);background:var(--bg);border-radius:var(--radius-sm);padding:9px 12px 9px 34px;font-size:13px;font-family:inherit;color:var(--text);}
  .search input:focus{outline:none;border-color:var(--brass);}
  .search input::placeholder{color:var(--text-3);}
  .search svg{position:absolute;left:11px;top:10px;width:15px;height:15px;color:var(--text-3);}
  .btn-primary{background:linear-gradient(135deg,#f4f6fb,#d4dae6);color:#15171c;border:none;padding:10px 16px;border-radius:var(--radius-sm);font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
  .btn-primary:hover{filter:brightness(1.08);}

  .content{padding:24px 26px;max-width:1560px;width:100%;flex:1;min-height:0;display:flex;flex-direction:column;}
  .panel{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;flex:1;min-height:0;}
  .panel-head{flex-shrink:0;}
  #wrap{flex:1;min-height:0;overflow-y:auto;}
  #wrap::-webkit-scrollbar{width:9px;}#wrap::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:5px;border:2px solid var(--bg-2);}
  .panel-head{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:2px solid var(--line-2);}
  .panel-head h2{font-family:var(--fd);font-size:14px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;}
  .panel-head .count{font-family:var(--fd);font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);background:transparent;border:none;border-left:2px solid var(--line-2);padding:2px 0 2px 10px;border-radius:0;}

  .table-wrap{}
  table{width:100%;border-collapse:collapse;}
  thead th{text-align:left;font-family:var(--fb);font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#8b93a4;font-weight:700;padding:11px 18px;border-bottom:2px solid var(--line-2);background:linear-gradient(180deg,var(--bg-3),var(--bg-2));position:sticky;top:0;z-index:5;}
  thead th.num{text-align:right;}
  td.num{text-align:right;}
  .q-date{font-family:var(--fb);font-size:13.5px;color:#fff;font-weight:400;white-space:nowrap;}
  tbody td{padding:13px 18px;border-bottom:1px solid var(--line);vertical-align:middle;font-family:var(--fb);font-size:13.5px;color:#fff;font-weight:400;}
  tbody tr{cursor:pointer;transition:background .1s;}
  tbody tr:hover{background:var(--bg-3);}
  tbody tr:last-child td{border-bottom:none;}
  .c-name{font-weight:700;color:#fff;font-size:14px;}
  .c-loc{font-size:12px;color:var(--text-3);margin-top:1px;font-weight:400;}
  .c-contact{font-size:13.5px;color:#fff;font-weight:400;}
  .c-mono{font-family:var(--fb);font-size:13.5px;color:#fff;font-weight:400;white-space:nowrap;}
  .stars{color:var(--star);font-size:13px;letter-spacing:1px;}
  .stars .off{color:var(--line-2);}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--bg-4);color:var(--text-2);font-family:var(--fm);}
  tbody tr:nth-child(even){background:rgba(255,255,255,.012);}
  /* sector chips: neutral, amber = season starting soon, green = in season now */
  .sec-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--fd);font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:rgba(139,147,165,.14);color:#aab2c0;margin-top:5px;}
  .sec-chip::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;}
  .sec-chip.hot{background:rgba(242,179,77,.14);color:#f2b34d;}
  .sec-chip.now{background:rgba(62,207,142,.13);color:#3ecf8e;}
  .filters{margin-left:auto;display:flex;gap:5px;}
  .tab{font-size:12.5px;padding:7px 14px;border-radius:6px;border:1px solid var(--line-2);background:var(--bg-3);color:var(--text-2);cursor:pointer;font-weight:600;font-family:inherit;}
  .tab.active{background:var(--brass);color:#15171c;border-color:var(--brass);}
  .tab .tn{font-family:var(--fm);font-size:10.5px;opacity:.75;margin-left:4px;}
  /* sector type-ahead in the drawer */
  .sec-box{position:relative;}
  .sec-menu{position:absolute;top:calc(100% + 3px);left:0;right:0;background:var(--bg-2);border:1px solid var(--line-2);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:80;max-height:210px;overflow-y:auto;display:none;}
  .sec-menu.open{display:block;}
  .sec-opt{padding:9px 12px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;}
  .sec-opt:hover{background:var(--bg-3);}
  .sec-opt .mo{font-size:11px;color:var(--text-3);white-space:nowrap;}
  .sec-opt.new{color:var(--brass-2);font-weight:600;}
  .sec-months{display:none;gap:10px;margin-top:9px;}
  .sec-months.open{display:flex;}
  .sec-months .field{flex:1;}
  .sec-hint{font-size:11px;color:var(--text-3);margin-top:5px;}

  /* drawer */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s;z-index:50;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:560px;max-width:94vw;background:var(--bg-2);border-left:1px solid var(--line-2);transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.2,1);z-index:60;display:flex;flex-direction:column;}
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;}
  .drawer-head h3{font-family:var(--fd);font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;}
  .drawer-head .x{margin-left:auto;background:var(--bg-4);border:none;color:var(--text-2);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;}
  .drawer-head .x:hover{background:var(--line-2);color:#fff;}
  .drawer-body{padding:22px;overflow-y:auto;flex:1;}
  .drawer-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;}

  .fgroup{margin-bottom:20px;}
  .fgroup-t{font-family:var(--fd);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--brass-2);margin-bottom:11px;padding-bottom:7px;border-bottom:1px solid var(--line);}
  .frow{display:flex;gap:12px;margin-bottom:12px;}
  .frow .field{flex:1;}
  label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);font-weight:700;margin-bottom:5px;}
  input.in,select.in,textarea.in{width:100%;border:1px solid var(--line-2);background:var(--bg);border-radius:var(--radius-sm);padding:9px 11px;font-size:13.5px;font-family:inherit;color:var(--text);}
  input.in:focus,select.in:focus,textarea.in:focus{outline:none;border-color:var(--brass);}
  textarea.in{resize:vertical;min-height:60px;}
  .btn{padding:9px 15px;border-radius:var(--radius-sm);font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;border:1px solid var(--line-2);background:var(--bg-3);color:var(--text);}
  .btn:hover{border-color:var(--brass);}
  .btn-save{background:linear-gradient(135deg,#f4f6fb,#d4dae6);color:#15171c;border:none;}
  .btn-save:hover{filter:brightness(1.08);}
  .contact-card{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;}
  .contact-card .frow{margin-bottom:8px;}
  .contact-card .frow:last-child{margin-bottom:0;}
  .add-contact{width:100%;padding:9px;border:1px dashed var(--line-2);background:transparent;border-radius:var(--radius-sm);color:var(--text-3);font-weight:600;cursor:pointer;font-family:inherit;font-size:13px;}
  .add-contact:hover{border-color:var(--brass);color:var(--brass-2);}
  .state{padding:44px;text-align:center;color:var(--text-3);}
  .msg{margin-right:auto;font-size:13px;color:var(--text-3);align-self:center;}
  .msg.ok{color:var(--approved);}.msg.err{color:var(--danger);}
  @media(max-width:880px){.app{grid-template-columns:1fr;}.sidebar{display:none;}}
  .app{display:grid;grid-template-columns:240px 1fr;min-height:100vh;transition:grid-template-columns .32s cubic-bezier(.4,0,.2,1);}
  .app.collapsed{grid-template-columns:68px 1fr;}
  .sidebar{background:var(--sidebar);color:var(--text-2);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:1px solid var(--line);width:240px;transition:width .32s cubic-bezier(.4,0,.2,1);z-index:50;overflow:hidden;}
  .app.collapsed .sidebar{width:68px;}
  .app.collapsed .sidebar:hover{width:240px;box-shadow:10px 0 36px -8px rgba(0,0,0,.65);}
  /* keep inner blocks at full width so text never squishes — the sidebar clips it */
  .sidebar .brand,.sidebar .nav,.sidebar .sidebar-foot{width:240px;flex-shrink:0;}
  /* labels/sub-text fade out only; layout width is fixed so nothing mushes */
  .nav a span.lbl,.nav a .badge,.brand .sub,.brand .mark,.sidebar-foot .foot-text,.nav-label{transition:opacity .32s cubic-bezier(.4,0,.2,1);}
  .app.collapsed .sidebar .brand .sub,
  .app.collapsed .sidebar .brand .mark,
  .app.collapsed .sidebar .nav-label,
  .app.collapsed .sidebar .nav a span.lbl,
  .app.collapsed .sidebar .nav a .badge,
  .app.collapsed .sidebar .sidebar-foot .foot-text{opacity:0;pointer-events:none;}
  .app.collapsed .sidebar:hover .brand .sub,
  .app.collapsed .sidebar:hover .brand .mark,
  .app.collapsed .sidebar:hover .nav-label,
  .app.collapsed .sidebar:hover .nav a span.lbl,
  .app.collapsed .sidebar:hover .nav a .badge,
  .app.collapsed .sidebar:hover .sidebar-foot .foot-text{opacity:1;pointer-events:auto;}
  /* compact "YRT" marks shown only while collapsed (and not hovered) */
  .brand-mini{display:none;position:absolute;top:20px;left:0;width:68px;text-align:center;font-family:var(--fd);font-weight:900;font-size:15px;color:#fff;letter-spacing:.04em;}
  .app.collapsed .sidebar .brand-mini{display:block;}
  .app.collapsed .sidebar:hover .brand-mini{display:none;}
  .app.collapsed .sidebar:not(:hover) .nav a span.lbl,
  .app.collapsed .sidebar:not(:hover) .brand .mark,
  .app.collapsed .sidebar:not(:hover) .sidebar-foot .foot-text{visibility:hidden;}
  .brand{position:relative;}
  .nav a{overflow:hidden;}
  .app.collapsed .sidebar:not(:hover) .nav a{padding-left:14px;padding-right:14px;}
  .app.collapsed .sidebar:not(:hover) .nav a.active{background:transparent;}
  .app.collapsed .sidebar:not(:hover) .nav a.active .ico{color:#fff;}
  .app.collapsed .sidebar:not(:hover) .brand{padding-left:0;padding-right:0;}
  /* ── directory restructure: stats band + client cards ── */
  .cl-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
  .cstat{background:var(--bg-2);border:1px solid var(--line-2);border-radius:11px;padding:14px 18px;}
  .cstat .l{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:700;}
  .cstat .v{font-size:24px;font-weight:800;font-family:'Archivo',sans-serif;margin-top:4px;}
  .cstat .v.warn{color:#e0883a;}
  .cstat .s{font-size:11px;color:var(--text-3);margin-top:2px;}
  @media(max-width:900px){.cl-stats{grid-template-columns:repeat(2,1fr);}}
  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;padding:16px;}
  .ccard{background:var(--bg-2);border:1px solid var(--line-2);border-radius:12px;padding:16px;cursor:pointer;transition:.14s;display:flex;flex-direction:column;gap:11px;}
  .ccard:hover{border-color:var(--brass-2);transform:translateY(-1px);}
  .cc-top{display:flex;align-items:flex-start;gap:12px;}
  .cc-av{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;background:linear-gradient(135deg,#6d28d9,#5b21b6);color:#fff;flex-shrink:0;}
  .cc-name{font-weight:700;font-size:14.5px;}
  .cc-loc{font-size:11.5px;color:var(--text-3);margin-top:2px;}
  .cc-top .sec-chip{margin-left:auto;flex-shrink:0;}
  .cc-mid{border-top:1px solid var(--line);padding-top:10px;}
  .cc-person{font-size:12.5px;font-weight:600;color:var(--text-2);}
  .cc-meta{font-size:11.5px;color:var(--text-3);margin-top:3px;word-break:break-word;}
  .cc-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px;font-size:11.5px;color:var(--text-3);}
  .cc-bal{font-weight:700;color:#3ddc84;}
  .cc-bal.ow{color:#e0883a;}
</style>
<link rel="stylesheet" href="theme.css?v=3">
</head>

      <a href="products.html"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span class="lbl">Products</span></a>

    </nav>
    <div class="sidebar-foot"><div class="avatar">YRT</div><div class="foot-text"><div style="color:var(--text);font-weight:700;">YRT CRM</div><div style="font-size:11px;color:var(--text-3);">Operations Suite</div></div><button class="logout-btn" id="logout-btn" title="Sign out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1>Clients</h1>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input type="text" id="search" placeholder="Search by name, city, contact…"></div>
      <button class="btn-primary" id="new-client"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>New Client</button>
    </header>
    <div class="content">
      <div class="cl-stats" id="cl-stats"></div>
      <section class="panel">
        <div class="panel-head"><h2 id="list-title">All Clients</h2><span class="count" id="count">—</span><div class="filters" id="cl-tabs"></div></div>
        <div id="wrap"><div class="state">Loading…</div></div>
      </section>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head"><h3 id="d-title">New Client</h3><button class="x" id="d-close">×</button></div>
  <div class="drawer-body" id="d-body"></div>
  <div class="drawer-foot"><span class="msg" id="d-msg"></span><button class="btn" id="d-cancel">Cancel</button><button class="btn-save btn" id="d-save">Save Client</button></div>
</aside>

<script type="module">
import { supabase as db, requireAuth, signOut, currentUser } from './auth.js';
await requireAuth();
const esc=s=>{const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;};
const PROV=['Ontario','Alberta','British Columbia','Manitoba','New Brunswick','Newfoundland and Labrador','Nova Scotia','Prince Edward Island','Quebec','Saskatchewan'];

let CLIENTS=[],EDITING=null,CONTACTS=[],SECTORS=[],SECMAP={},SEC_OK=false,VIEW='all';
const MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// months until a sector's busy season starts (0 = starts this month)
const monthsAhead=m=>{const cur=new Date().getMonth()+1;return ((m-cur)+12)%12;};
// is the current month inside the from..to range (inclusive, wraps year-end)?
const inSeason=(f,t)=>{const cur=new Date().getMonth()+1;return f<=t?(cur>=f&&cur<=t):(cur>=f||cur<=t);};
const seasonLabel=s=>MONS[s.active_from_month-1]+'–'+MONS[s.active_to_month-1];
// A client is "upcoming" when their sector's season is running or starts within 3 months.
function secState(c){
  const s=SECMAP[c.sector_id]; if(!s)return null;
  if(inSeason(s.active_from_month,s.active_to_month))return {s,cls:'now',note:'Active now'};
  const d=monthsAhead(s.active_from_month);
  if(d>=1&&d<=3)return {s,cls:'hot',note:'Starts '+MONS[s.active_from_month-1]};
  return {s,cls:'',note:''};
}

function stars(n){n=n||0;let s='';for(let i=1;i<=5;i++)s+=`<span class="${i<=n?'':'off'}">★</span>`;return `<span class="stars">${s}</span>`;}
function money(n){return '$'+(Number(n)||0).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtD(d){if(!d)return '—';const x=new Date(d+'T00:00:00');return x.toLocaleDateString('en-CA',{year:'numeric',month:'short',day:'numeric'});}

async function load(){
  const {data,error}=await db.from('clients').select('*, contacts(*)').order('company_name');
  if(error){document.getElementById('wrap').innerHTML=`<div class="state">Couldn't load — ${error.message}</div>`;return;}
  CLIENTS=data||[];
  // outstanding balance per client (from unpaid/partial invoices) + last invoice date
  const {data:invs}=await db.from('invoices').select('client_id,balance_due,invoice_date,grand_total');
  // last activity per client (most recent quote/order/invoice date on the quotes table)
  const {data:qs}=await db.from('quotes').select('client_id,quote_date');
  const balByClient={}, lastByClient={}, spendByClient={};
  (invs||[]).forEach(iv=>{
    if(iv.client_id){
      balByClient[iv.client_id]=(balByClient[iv.client_id]||0)+Number(iv.balance_due||0);
      spendByClient[iv.client_id]=(spendByClient[iv.client_id]||0)+Number(iv.grand_total||0);
      if(iv.invoice_date && (!lastByClient[iv.client_id] || iv.invoice_date>lastByClient[iv.client_id])) lastByClient[iv.client_id]=iv.invoice_date;
    }
  });
  (qs||[]).forEach(q=>{
    if(q.client_id && q.quote_date && (!lastByClient[q.client_id] || q.quote_date>lastByClient[q.client_id])) lastByClient[q.client_id]=q.quote_date;
  });
  CLIENTS.forEach(c=>{ c._balance=balByClient[c.id]||0; c._spend=spendByClient[c.id]||0; c._lastDate=lastByClient[c.id]||null; });
  // Sectors are optional plumbing: if the table doesn't exist yet, everything
  // sector-related simply stays hidden and the page works as before.
  const {data:secs,error:secErr}=await db.from('sectors').select('*').order('name');
  SEC_OK=!secErr; SECTORS=secs||[]; SECMAP={}; SECTORS.forEach(s=>SECMAP[s.id]=s);
  const _nc=document.getElementById('nav-clients');if(_nc)_nc.textContent=CLIENTS.length;
  render();
}
function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  let rows=CLIENTS.filter(c=>{
    if(!q)return true;
    // search company + city + EVERY contact (name, designation, phone, email)
    const contactText=(c.contacts||[]).map(ct=>[ct.first_name,ct.last_name,ct.designation,ct.tel1,ct.tel2,ct.email1,ct.email2].filter(Boolean).join(' ')).join(' ');
    const hay=((c.company_name||'')+' '+(c.bill_city||'')+' '+(c.bill_province||'')+' '+contactText).toLowerCase();
    return hay.includes(q);
  });
  // tabs: All | Upcoming Season (sector active now or starting within 3 months)
  const upcoming=CLIENTS.filter(c=>{const st=secState(c);return st&&(st.cls==='now'||st.cls==='hot');});
  const tabsEl=document.getElementById('cl-tabs');
  if(tabsEl){
    tabsEl.innerHTML=SEC_OK?`<button class="tab ${VIEW==='all'?'active':''}" data-v="all">All</button>`
      +`<button class="tab ${VIEW==='upcoming'?'active':''}" data-v="upcoming">Upcoming Season<span class="tn">${upcoming.length}</span></button>`:'';
    tabsEl.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{VIEW=t.dataset.v;render();}));
  }
  if(VIEW==='upcoming'){
    const ids=new Set(upcoming.map(c=>c.id));
    rows=rows.filter(c=>ids.has(c.id));
    // soonest season first: active-now, then by months until start
    rows.sort((a,b)=>{const A=secState(a),B=secState(b);
      const ka=A.cls==='now'?-1:monthsAhead(A.s.active_from_month);
      const kb=B.cls==='now'?-1:monthsAhead(B.s.active_from_month);
      return ka-kb;});
  }
  const _lt=document.getElementById('list-title');if(_lt)_lt.textContent=VIEW==='upcoming'?'Upcoming Season':'All Clients';
  // stats band — the directory's dashboard
  const owing=CLIENTS.reduce((t,c)=>t+(c._balance||0),0);
  const owingCount=CLIENTS.filter(c=>(c._balance||0)>0.005).length;
  const lifetime=CLIENTS.reduce((t,c)=>t+(c._spend||0),0);
  const top=CLIENTS.reduce((best,c)=>(c._spend||0)>(best?best._spend||0:0)?c:best,null);
  const topName=top&&top._spend>0?top.company_name:'—';
  const money0=n=>'$'+Math.round(Number(n)||0).toLocaleString('en-CA');
  const stEl=document.getElementById('cl-stats');
  if(stEl)stEl.innerHTML=`
    <div class="cstat"><div class="l">In / Near Season</div><div class="v">${upcoming.length}</div><div class="s">clients to call first</div></div>
    <div class="cstat"><div class="l">Balance Owing</div><div class="v${owing>0?' warn':''}">${money0(owing)}</div><div class="s">${owingCount} client${owingCount===1?'':'s'} owe you</div></div>
    <div class="cstat"><div class="l">Lifetime Billed</div><div class="v">${money0(lifetime)}</div><div class="s">total from the whole book</div></div>
    <div class="cstat"><div class="l">Top Client</div><div class="v" style="font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(topName)}</div><div class="s">${top&&top._spend>0?money0(top._spend)+' billed':'no invoices yet'}</div></div>`;
  document.getElementById('count').textContent=rows.length+(rows.length===1?' client':' clients');
  if(!rows.length){document.getElementById('wrap').innerHTML=`<div class="state">${VIEW==='upcoming'?'No sectors go into season within the next 3 months.':'No clients found. Click “New Client” to add one.'}</div>`;return;}
  const initials=n=>(n||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  const body=rows.map(c=>{
    const prim=(c.contacts||[]).find(x=>x.is_primary)||(c.contacts||[])[0]||{};
    const cn=((prim.first_name||'')+' '+(prim.last_name||'')).trim();
    const bal=c._balance||0;
    const st=secState(c);
    return `<div class="ccard" data-id="${c.id}">
      <div class="cc-top">
        <div class="cc-av">${esc(initials(c.company_name))}</div>
        <div class="cc-id"><div class="cc-name">${esc(c.company_name)}</div><div class="cc-loc">${esc([c.bill_city,c.bill_province].filter(Boolean).join(', ')||'—')}</div></div>
        ${st?`<span class="sec-chip ${st.cls}" title="Busy season ${seasonLabel(st.s)}">${esc(st.s.name)}${st.note?' · '+st.note:''}</span>`:''}
      </div>
      <div class="cc-mid">
        <div class="cc-person">${esc(cn||'No contact on file')}${prim.designation?' · <span style="color:var(--text-3);font-weight:400;">'+esc(prim.designation)+'</span>':''}</div>
        <div class="cc-meta">${esc(prim.tel1||'')}${prim.tel1&&prim.email1?' · ':''}${esc(prim.email1||'')}</div>
      </div>
      <div class="cc-foot">
        <span>Last ${fmtD(c._lastDate)}</span>
        <span class="cc-bal ${bal>0?'ow':''}">${bal>0?money(bal)+' due':'Clear'}</span>
      </div>
    </div>`;}).join('');
  document.getElementById('wrap').innerHTML=`<div class="cgrid">${body}</div>`;
  document.querySelectorAll('.ccard[data-id]').forEach(el=>el.addEventListener('click',()=>location.href='client.html?id='+encodeURIComponent(el.dataset.id)));
}
function openDrawer(){document.getElementById('overlay').classList.add('open');document.getElementById('drawer').classList.add('open');}
function closeDrawer(){document.getElementById('overlay').classList.remove('open');document.getElementById('drawer').classList.remove('open');document.getElementById('d-msg').textContent='';}

function newClient(){EDITING=null;CONTACTS=[{first_name:'',last_name:'',designation:'',tel1:'',email1:'',is_primary:true}];document.getElementById('d-title').textContent='New Client';drawForm({});openDrawer();}
// (dead edit() removed — rows open the full client profile, editing lives there)

function drawForm(c){
  const provOpts=PROV.map(p=>`<option ${c.bill_province===p?'selected':''}>${p}</option>`).join('');
  document.getElementById('d-body').innerHTML=`
    <div class="fgroup">
      <div class="fgroup-t">Company</div>
      <div class="field" style="margin-bottom:12px;"><label>Company Name *</label><input class="in" id="company_name" value="${esc(c.company_name||'')}"></div>
      ${SEC_OK?`<div class="field sec-box" style="margin-bottom:12px;"><label>Sector</label>
        <input class="in" id="sector-input" placeholder="Start typing — e.g. Schools" autocomplete="off" value="${esc((SECMAP[c.sector_id]||{}).name||'')}">
        <div class="sec-menu" id="sec-menu"></div>
        <div class="sec-months" id="sec-months">
          <div class="field"><label>Busy From</label><select class="in" id="sec-from">${MONS.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}</select></div>
          <div class="field"><label>Busy To</label><select class="in" id="sec-to">${MONS.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}</select></div>
        </div>
        <div class="sec-hint" id="sec-hint"></div>
      </div>`:''}
      <div class="frow"><div class="field"><label>Rating</label><select class="in" id="rating">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${(c.rating||0)===n?'selected':''}>${n===0?'Unrated':n+' ★'}</option>`).join('')}</select></div>
        <div class="field"><label>Terms (days)</label><input class="in" id="terms_days" type="number" value="${c.terms_days||0}"></div>
        <div class="field"><label>Serviced By</label><input class="in" id="serviced_by" value="${esc(c.serviced_by||'')}"></div></div>
    </div>
    <div class="fgroup">
      <div class="fgroup-t">Billing Address</div>
      <div class="frow"><div class="field" style="max-width:90px;"><label>Unit</label><input class="in" id="bill_unit" value="${esc(c.bill_unit||'')}"></div>
        <div class="field"><label>Address</label><input class="in" id="bill_address" value="${esc(c.bill_address||'')}"></div></div>
      <div class="frow"><div class="field"><label>City</label><input class="in" id="bill_city" value="${esc(c.bill_city||'')}"></div>
        <div class="field" style="max-width:120px;"><label>Postal</label><input class="in" id="bill_postal" value="${esc(c.bill_postal||'')}"></div></div>
      <div class="field"><label>Province</label><select class="in" id="bill_province">${provOpts}</select></div>
    </div>
    <div class="fgroup">
      <div class="fgroup-t">Contacts</div>
      <div id="contacts-list"></div>
      <button class="add-contact" id="add-contact">+ Add contact</button>
    </div>
    <div class="fgroup">
      <div class="fgroup-t">Notes</div>
      <div class="field" style="margin-bottom:12px;"><label>General Notes</label><textarea class="in" id="notes">${esc(c.notes||'')}</textarea></div>
      <div class="field"><label>Internal Notes (staff only)</label><textarea class="in" id="internal_notes">${esc(c.internal_notes||'')}</textarea></div>
    </div>`;
  drawContacts();
  if(SEC_OK)wireSector(c.sector_id);
  document.getElementById('add-contact').addEventListener('click',()=>{CONTACTS.push({first_name:'',last_name:'',designation:'',tel1:'',email1:'',is_primary:CONTACTS.length===0});drawContacts();});
}

// ── Sector type-ahead: pick an existing sector (no duplicates) or create one
//    inline with its busy-season months. Matching is case-insensitive.
let SEC_SEL=null;   // the chosen existing sector id, when the input matches one
function wireSector(currentId){
  const inp=document.getElementById('sector-input'),menu=document.getElementById('sec-menu');
  const months=document.getElementById('sec-months'),hint=document.getElementById('sec-hint');
  SEC_SEL=currentId||null;
  const sync=()=>{
    const q=inp.value.trim().toLowerCase();
    const exact=SECTORS.find(s=>s.name.toLowerCase()===q);
    SEC_SEL=exact?exact.id:null;
    const isNew=q&&!exact;
    months.classList.toggle('open',isNew);
    hint.textContent=exact?('Busy season '+seasonLabel(exact)):(isNew?'New sector — set its busy season below.':'');
    if(!q){menu.classList.remove('open');return;}
    const hits=SECTORS.filter(s=>s.name.toLowerCase().includes(q)).slice(0,8);
    menu.innerHTML=hits.map(s=>`<div class="sec-opt" data-id="${s.id}"><span>${esc(s.name)}</span><span class="mo">${seasonLabel(s)}</span></div>`).join('')
      +(exact?'':`<div class="sec-opt new" data-new="1">＋ Create “${esc(inp.value.trim())}”</div>`);
    menu.classList.add('open');
    menu.querySelectorAll('.sec-opt').forEach(o=>o.addEventListener('mousedown',e=>{
      e.preventDefault();
      if(o.dataset.id){const s=SECMAP[o.dataset.id];inp.value=s.name;SEC_SEL=s.id;months.classList.remove('open');hint.textContent='Busy season '+seasonLabel(s);}
      else{months.classList.add('open');hint.textContent='New sector — set its busy season below.';}
      menu.classList.remove('open');
    }));
  };
  inp.addEventListener('input',sync);
  inp.addEventListener('focus',sync);
  inp.addEventListener('blur',()=>setTimeout(()=>menu.classList.remove('open'),150));
}
// Returns the sector_id to store (creating the sector first if it's new).
async function resolveSector(){
  if(!SEC_OK)return undefined;                       // table not installed yet
  const inp=document.getElementById('sector-input');
  if(!inp)return undefined;
  const name=inp.value.trim();
  if(!name)return null;                              // cleared -> no sector
  const exact=SECTORS.find(s=>s.name.toLowerCase()===name.toLowerCase());
  if(exact)return exact.id;
  const payload={name,active_from_month:+document.getElementById('sec-from').value||1,active_to_month:+document.getElementById('sec-to').value||12};
  const {data,error}=await db.from('sectors').insert(payload).select().single();
  if(error)throw new Error('Sector: '+error.message);
  SECTORS.push(data);SECMAP[data.id]=data;
  return data.id;
}
function drawContacts(){
  document.getElementById('contacts-list').innerHTML=CONTACTS.map((ct,i)=>`
    <div class="contact-card">
      <div class="frow"><div class="field"><label>First Name</label><input class="in ct" data-i="${i}" data-k="first_name" value="${esc(ct.first_name||'')}"></div>
        <div class="field"><label>Last Name</label><input class="in ct" data-i="${i}" data-k="last_name" value="${esc(ct.last_name||'')}"></div></div>
      <div class="frow"><div class="field"><label>Designation</label><input class="in ct" data-i="${i}" data-k="designation" value="${esc(ct.designation||'')}"></div>
        <div class="field"><label>Telephone</label><input class="in ct" data-i="${i}" data-k="tel1" value="${esc(ct.tel1||'')}"></div></div>
      <div class="frow"><div class="field"><label>Email</label><input class="in ct" data-i="${i}" data-k="email1" value="${esc(ct.email1||'')}"></div></div>
      <div class="frow" style="align-items:center;"><label style="margin:0;display:flex;gap:7px;align-items:center;cursor:pointer;color:var(--text-2);text-transform:none;letter-spacing:0;font-size:12.5px;"><input type="radio" name="primary" ${ct.is_primary?'checked':''} data-prim="${i}"> Primary contact</label>
        ${CONTACTS.length>1?`<button class="btn" data-del="${i}" style="margin-left:auto;padding:5px 11px;">Remove</button>`:''}</div>
    </div>`).join('');
  document.querySelectorAll('.ct').forEach(inp=>inp.addEventListener('input',()=>{CONTACTS[+inp.dataset.i][inp.dataset.k]=inp.value;}));
  document.querySelectorAll('[data-prim]').forEach(r=>r.addEventListener('change',()=>{CONTACTS.forEach((c,i)=>c.is_primary=(i===+r.dataset.prim));}));
  document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{CONTACTS.splice(+b.dataset.del,1);if(!CONTACTS.some(c=>c.is_primary)&&CONTACTS.length)CONTACTS[0].is_primary=true;drawContacts();}));
}

async function save(){
  const msg=document.getElementById('d-msg');
  const name=document.getElementById('company_name').value.trim();
  if(!name){msg.textContent='Company name is required';msg.className='msg err';return;}
  msg.textContent='Saving…';msg.className='msg';
  let _sector; try{_sector=await resolveSector();}catch(e){msg.textContent=e.message;msg.className='msg err';return;}
  const payload={company_name:name,rating:+document.getElementById('rating').value||null,
    terms_days:+document.getElementById('terms_days').value||0,serviced_by:document.getElementById('serviced_by').value||null,
    bill_unit:document.getElementById('bill_unit').value||null,bill_address:document.getElementById('bill_address').value||null,
    bill_city:document.getElementById('bill_city').value||null,bill_postal:document.getElementById('bill_postal').value||null,
    bill_province:document.getElementById('bill_province').value||null,notes:document.getElementById('notes').value||null,
    internal_notes:document.getElementById('internal_notes').value||null};
  if(_sector!==undefined)payload.sector_id=_sector;
  let clientId;
  if(EDITING){const {error}=await db.from('clients').update(payload).eq('id',EDITING.id);if(error){msg.textContent='Error: '+error.message;msg.className='msg err';return;}clientId=EDITING.id;
    await db.from('contacts').delete().eq('client_id',clientId);
  }else{const {data,error}=await db.from('clients').insert(payload).select().single();if(error){msg.textContent='Error: '+error.message;msg.className='msg err';return;}clientId=data.id;}
  const validContacts=CONTACTS.filter(c=>(c.first_name||c.last_name||c.tel1||c.email1));
  if(validContacts.length){
    const rows=validContacts.map(c=>({client_id:clientId,first_name:c.first_name||null,last_name:c.last_name||null,designation:c.designation||null,tel1:c.tel1||null,email1:c.email1||null,is_primary:!!c.is_primary}));
    const {error}=await db.from('contacts').insert(rows);if(error){msg.textContent='Contacts error: '+error.message;msg.className='msg err';return;}
  }
  msg.textContent='Saved ✓';msg.className='msg ok';
  await load();setTimeout(closeDrawer,600);
}

document.getElementById('new-client').addEventListener('click',newClient);
document.getElementById('d-close').addEventListener('click',closeDrawer);
document.getElementById('d-cancel').addEventListener('click',closeDrawer);
document.getElementById('overlay').addEventListener('click',closeDrawer);
document.getElementById('d-save').addEventListener('click',save);
document.getElementById('search').addEventListener('input',render);
const _lo=document.getElementById('logout-btn');if(_lo)_lo.addEventListener('click',()=>signOut());
load();
</script>
</body>
</html>
